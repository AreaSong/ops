name: LosAngeles External Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      manage_issues:
        description: Manage the production incident Issue (default branch only)
        required: true
        default: false
        type: boolean
      simulation_mode:
        description: Controlled Issue lifecycle test mode
        required: true
        default: none
        type: choice
        options:
          - none
          - failure
          - recovery

permissions:
  contents: read
  issues: write

concurrency:
  group: >-
    losangeles-external-uptime-${{
      github.event_name == 'schedule' && github.event.schedule == '17 3 1 * *'
      && 'monthly-simulation' || 'probe'
    }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Check public HTTPS endpoints
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATION_MODE: ${{ inputs.simulation_mode }}
          UPTIME_ROUNDS: ${{ github.event_name == 'schedule' && '5' || '1' }}
          UPTIME_INTERVAL_SECONDS: "60"
          FAILURE_THRESHOLD: "3"
          HEARTBEAT_MAX_AGE_SECONDS: "600"
          CF_ACCESS_REQUIRED: "true"
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$SIMULATION_MODE" == "failure" ]]; then
            printf 'checked_at=%s\nFAIL\tsimulation\thttp=503\tcurl_exit=22\terror=controlled workflow_dispatch failure\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee external-uptime-result.txt
            exit 1
          fi
          if [[ "$SIMULATION_MODE" == "recovery" ]]; then
            printf 'checked_at=%s\nOK\tsimulation\thttp=200\ttime=0.000000\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee external-uptime-result.txt
            exit 0
          fi
          rm -rf external-monitor-rounds
          if scripts/monitor/external-monitor-loop.sh external-monitor-rounds >external-uptime-result.txt 2>&1; then
            passed=1
          else
            passed=0
          fi
          cat external-uptime-result.txt
          if [[ "$passed" -ne 1 ]]; then
            exit 1
          fi

      - name: Open or close the incident issue
        if: >-
          always() &&
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
          github.ref_name == github.event.repository.default_branch &&
          inputs.manage_issues))
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          INCIDENT_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.simulation_mode != 'none' && 'simulation' || 'production' }}
        shell: bash
        run: |
          if [[ "$INCIDENT_KIND" == simulation ]]; then
            scripts/monitor/external-uptime-incident.sh \
              "$CHECK_OUTCOME" external-uptime-result.txt simulation
            exit 0
          fi
          while IFS=$'\t' read -r check_kind outcome result_file; do
            if [[ "$outcome" == pending ]]; then
              continue
            fi
            case "$check_kind" in
              uptime)
                scripts/monitor/external-uptime-incident.sh "$outcome" "$result_file" production
                ;;
              heartbeat)
                scripts/monitor/external-uptime-incident.sh "$outcome" "$result_file" heartbeat
                ;;
              *)
                echo "unknown external monitor kind: $check_kind" >&2
                exit 1
                ;;
            esac
          done <external-monitor-rounds/status.tsv

      - name: Mark unhealthy checks as failed
        if: steps.check.outcome == 'failure'
        run: exit 1

  monthly-issue-simulation:
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      github.event.schedule == '17 3 1 * *'
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Exercise the managed Issue failure and recovery lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          cleanup() {
            scripts/monitor/external-uptime-incident.sh success "$result_file" simulation || true
            rm -f "$result_file"
          }
          trap cleanup EXIT

          printf 'checked_at=%s\nFAIL\tsimulation\thttp=503\tcurl_exit=22\terror=monthly controlled failure\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$result_file"
          scripts/monitor/external-uptime-incident.sh failure "$result_file" simulation

          gh issue list --state open --label external-uptime-test --limit 100 \
            --json body | jq -e \
            'any(.[]; (.body // "") | contains("<!-- areasong-external-uptime-simulation:v1 -->"))'

          scripts/monitor/external-uptime-incident.sh success "$result_file" simulation
          trap - EXIT
          rm -f "$result_file"

          ! gh issue list --state open --label external-uptime-test --limit 100 \
            --json body | jq -e \
            'any(.[]; (.body // "") | contains("<!-- areasong-external-uptime-simulation:v1 -->"))'
