# /etc/nginx/sites-available/__DOMAIN__.conf
#
# Default mode for Cloudflare-proxied domains:
# Cloudflare -> Nginx 443 -> 127.0.0.1:__HOST_PORT__
#
# If the domain is DNS-only, replace the certificate paths with Let's Encrypt paths.

server {
    listen 80;
    server_name __DOMAIN__;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/ssl/cf/top/origin.pem;
    ssl_certificate_key /etc/ssl/cf/top/origin.key;

    access_log /var/log/nginx/__APP_NAME__-access.log;
    error_log /var/log/nginx/__APP_NAME__-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:__HOST_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
