name: account-vault

x-json-log-options: &json-log-options
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-security-options: &security-options
  - no-new-privileges:true

services:
  web:
    image: ${ACCOUNT_VAULT_IMAGE:?ACCOUNT_VAULT_IMAGE must be an immutable GHCR digest reference}
    user: "node"
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    cpus: "0.50"
    pids_limit: 256
    logging: *json-log-options
    security_opt: *security-options
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8392:3001"
    environment:
      - DATABASE_URL=postgresql://${DATABASE_APP_USER:?DATABASE_APP_USER must be the low-privilege runtime role}:${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}@postgres:5432/accountvault?schema=public
      - NODE_ENV=production
      - RP_ID=${RP_ID:?RP_ID is required}
      - RP_NAME=${RP_NAME:-账号记录管理}
      - ORIGIN=${ORIGIN:?ORIGIN is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - REGISTRATION_TOKEN=${REGISTRATION_TOKEN:?REGISTRATION_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    image: ${ACCOUNT_VAULT_IMAGE:?ACCOUNT_VAULT_IMAGE must be an immutable GHCR digest reference}
    user: "node"
    profiles: ["tools"]
    restart: "no"
    mem_limit: 256m
    memswap_limit: 384m
    cpus: "0.50"
    pids_limit: 256
    logging: *json-log-options
    security_opt: *security-options
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-account_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for migrations}@postgres:5432/accountvault?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/docker-migrate.sh"]

  postgres:
    image: postgres:15-alpine@sha256:cd17e2ac98240fce1541ad2a803b34009b4eea5aec8a832363cdc7eca62e722e
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    cpus: "0.75"
    pids_limit: 512
    logging: *json-log-options
    security_opt: *security-options
    environment:
      - POSTGRES_USER=account_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=accountvault
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user -d accountvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    external: true
    name: sorryiossearch_pgdata
