# 服务器台账（结构化）

# 维护规则：
# 1. 新增/释放机器时更新本文件并 git 提交
# 2. 同步更新 servers.md 人类可读摘要
# 3. commit message 格式：[inventory] 描述变更

servers:
  - hostname: LosAngeles
    cloud: crystalclear-solutions-llc
    region: us-ca-los-angeles
    public_ip: "23.185.200.12"
    private_ip: ""
    ansible_user: as
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519_losangeles"
    owner: as
    os: ubuntu-24.04
    roles:
      - web
      - docker-app
      - proxy
    services:
      - nginx
      - x-ui
      - xray
      - resume-jadeai
      - areaforge-web
      - areaforge-postgres
      - sub2api
      - sub2api-postgres
      - sub2api-redis
      - account-vault-web
      - account-vault-postgres
    data_disk: false
    provider_evidence:
      public_ip_rdap_org: "CrystalClear Solutions LLC"
      public_ip_rdap_netname: "CRYSTAL"
      public_ip_rdap_cidr: "23.185.200.0/24"
      public_ip_asn_org: "AS8796 FASTNET DATA INC"
      geo: "Los Angeles, California, US"
      virtualization: "KVM/QEMU"
      cloud_init: "nocloud"
    control_plane:
      control_panel_url: "https://server.zgocloud.cc/"
      instance_name: LosAngeles
      confirmed_at: "2026-07-05"
      confirmed_by: as
      account_mfa_enabled: true
      account_recovery_contacts_available: true
      main_account_shared: false
      api_keys: none
      security_group_or_cloud_firewall: not_supported_by_provider
      snapshots: none
      audit_or_security_notifications: none
      billing_expiry_alerts: deferred_by_user
    notes: "主机名不符合规范；ens3 直接使用公网 23.185.200.12/24，未发现主机级 RFC1918 私网 IP；Docker bridge 使用 172.17/18/19/20/21 网段；服务已主要规范到 /opt/services；旧 /root/JadeAI 与 /root/sorryiosSearch 已归档并删除；云厂商控制台 https://server.zgocloud.cc/ 实例名 LosAngeles，MFA enabled，邮箱/手机号可用，主账号未共用，无 API Key；厂商无安全组/云防火墙/网络规则、快照、云审计/安全通知，账单/到期治理暂缓；UFW active: allow 22/80/443 + 9100 仅 172.16.0.0/12, default deny incoming；SSH 已禁用 root/password，仅 as key 登录；Fail2ban sshd jail enabled: maxretry 5, findtime 10m, bantime 1h；本机备份 enabled: /opt/ops/scripts/backup, /var/backups/ops, daily cron, 7d retention；R2 offsite backup enabled；监控 enabled: Prometheus/Grafana/Alertmanager/Loki/Promtail/Node Exporter/Blackbox, local ports only (node-exporter host 网络监听 9100 由 UFW 限制), Grafana via https://monitor.areasong.top/ (grafana 11.6.16 按 digest 锁定, 数据源固定 uid prometheus/loki, 看板按 uid 引用+中文模板变量+跨看板导航, 2026-07-20 升级)；GitHub 只读 deploy key enabled: /root/.ssh/id_ed25519_ops_deploy（仅 fetch，无推送权限，/opt/ops 仓库级 core.sshCommand），2026-07-20 配置；x-ui/xray 流量审计 enabled: access log(/var/log/xray)→Loki + geosite 分桶出站统计→xray_outbound_traffic_bytes_total，看板 losangeles-xray-traffic-audit，2026-07-20 配置。"

# Ansible 分组（自动生成 inventory 时使用）
groups:
  prod:
    - LosAngeles
  monitor:
    - LosAngeles
  web:
    - LosAngeles
  docker_app:
    - LosAngeles
  proxy:
    - LosAngeles
