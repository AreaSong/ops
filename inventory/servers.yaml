# 服务器台账（结构化）

# 维护规则：
# 1. 新增/释放机器时更新本文件并 git 提交
# 2. 同步更新 servers.md 人类可读摘要
# 3. commit message 格式：[inventory] 描述变更

servers:
  - hostname: prod-web-01
    cloud: aliyun
    region: cn-hangzhou
    public_ip: "x.x.x.x"
    private_ip: "172.16.x.x"
    os: ubuntu-22.04
    roles:
      - web
    services:
      - nginx
      - app
    data_disk: false
    notes: "示例条目，请替换为真实数据"

  - hostname: prod-monitor-01
    cloud: aliyun
    region: cn-hangzhou
    public_ip: ""
    private_ip: "172.16.x.x"
    os: ubuntu-22.04
    roles:
      - monitor
    services:
      - prometheus
      - grafana
      - loki
      - alertmanager
    data_disk: true
    notes: "可观测栈承载机器"

  - hostname: LosAngeles
    cloud: unknown
    region: unknown
    public_ip: "23.185.200.12"
    private_ip: ""
    os: ubuntu-24.04
    roles:
      - web
      - docker-app
      - proxy
    services:
      - nginx
      - x-ui
      - xray
      - resume-jadeai
      - sub2api
      - sub2api-postgres
      - sub2api-redis
      - account-vault-web
      - account-vault-postgres
    data_disk: false
    notes: "主机名不符合规范；服务已主要规范到 /opt/services；仍需迁移 account-vault 对 /root/sorryiosSearch 的 build/env 引用；UFW active: allow 22/80/443, default deny incoming；SSH 已禁用 root/password，仅 as key 登录；Fail2ban sshd jail enabled: maxretry 5, findtime 10m, bantime 1h；本机备份 enabled: /opt/ops/scripts/backup, /var/backups/ops, daily cron, 7d retention；监控 enabled: Prometheus/Grafana/Alertmanager/Loki/Promtail/Node Exporter/Blackbox, local ports only, Grafana via https://monitor.areasong.top/；需确认云厂商、region、私网 IP、业务 owner。"

# Ansible 分组（自动生成 inventory 时使用）
groups:
  prod:
    - prod-web-01
    - prod-monitor-01
    - LosAngeles
  monitor:
    - prod-monitor-01
  web:
    - prod-web-01
    - LosAngeles
  docker_app:
    - LosAngeles
  proxy:
    - LosAngeles
