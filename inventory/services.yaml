# 服务与端口台账（结构化）

# LosAngeles 的详细拓扑以 losangeles-assets.yaml 为权威源；本文件保留跨主机服务摘要。
# 维护规则：
# 1. 新增/变更服务或端口时更新本文件并 git 提交
# 2. 同步更新 ports.md 人类可读摘要
# 3. commit message 格式：[inventory] 描述变更

services:
  - name: nginx
    host: LosAngeles
    deploy_type: systemd
    ports:
      - port: 80
        protocol: tcp
        expose: "0.0.0.0/0"
        notes: "公网 HTTP，反代多个域名"
      - port: 443
        protocol: tcp
        expose: "0.0.0.0/0"
        notes: "公网 HTTPS，反代多个域名；log.areasong.top 已新增 /sub/ 订阅反代到本机 2096"
    dependencies:
      - resume-jadeai
      - areaforge-web
      - sub2api
      - account-vault-web
      - x-ui
    backup: true
    monitoring: []

  - name: x-ui
    host: LosAngeles
    deploy_type: systemd
    ports:
      - port: 2096
        protocol: tcp
        expose: "127.0.0.1"
        notes: "订阅分享后端已绑定 127.0.0.1；公网访问统一通过 Nginx 443 /sub/"
      - port: 46585
        protocol: tcp
        expose: "127.0.0.1"
        notes: "x-ui 面板后端已绑定 127.0.0.1；公网访问仅通过 Nginx 反代"
    dependencies: []
    backup: true
    monitoring: []

  - name: xray
    host: LosAngeles
    deploy_type: systemd
    ports:
      - port: 10000
        protocol: tcp
        expose: "127.0.0.1"
        notes: "xray WebSocket 后端已绑定 127.0.0.1；公网访问通过 Nginx 443 /as"
      - port: 11111
        protocol: tcp
        expose: "127.0.0.1"
        notes: "本机监听"
      - port: 62789
        protocol: tcp
        expose: "127.0.0.1"
        notes: "本机监听"
    dependencies: []
    backup: true
    monitoring: []

  - name: resume-jadeai
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/services/resume-jadeai
    ports:
      - port: 2082
        protocol: tcp
        expose: "127.0.0.1"
        notes: "映射到容器 3000，Nginx 反代"
    dependencies: []
    backup: true
    monitoring:
      - docker_container_running
      - blackbox_app_https
      - blackbox_business_https

  - name: account-vault-web
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/services/account-vault
    ports:
      - port: 8392
        protocol: tcp
        expose: "127.0.0.1"
        notes: "映射到容器 3001，Nginx 反代"
    dependencies:
      - account-vault-postgres
    backup: true
    monitoring:
      - docker_container_running
      - blackbox_app_https
      - blackbox_business_https

  - name: account-vault-postgres
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/services/account-vault
    ports:
      - port: 25432
        protocol: tcp
        expose: "127.0.0.1"
        notes: "映射到容器 5432，仅本机访问"
    dependencies: []
    backup: true
    monitoring: []

  - name: areaforge-web
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/areaforge
    ports:
      - port: 3020
        protocol: tcp
        expose: "127.0.0.1"
        notes: "映射到容器 3000，Nginx 反代"
    dependencies:
      - areaforge-postgres
    backup: true
    backup_script: scripts/backup/backup-volumes.sh
    monitoring:
      - docker_container_running
      - blackbox_app_https
      - business_log_metrics

  - name: areaforge-postgres
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/areaforge
    ports:
      - port: 5432
        protocol: tcp
        expose: "docker-network"
        notes: "仅容器网络暴露"
    dependencies: []
    backup: true
    backup_script: scripts/backup/backup-postgres.sh
    monitoring:
      - docker_container_running

  - name: sub2api
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/services/sub2api
    ports:
      - port: 8080
        protocol: tcp
        expose: "127.0.0.1"
        notes: "映射到容器 8080，Nginx 反代"
    dependencies:
      - sub2api-postgres
      - sub2api-redis
    backup: true
    monitoring:
      - docker_container_running
      - blackbox_app_https
      - blackbox_business_https

  - name: sub2api-postgres
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/services/sub2api
    ports:
      - port: 5432
        protocol: tcp
        expose: "docker-network"
        notes: "仅容器网络暴露"
    dependencies: []
    backup: true
    monitoring: []

  - name: sub2api-redis
    host: LosAngeles
    deploy_type: docker-compose
    compose_path: /opt/services/sub2api
    ports:
      - port: 6379
        protocol: tcp
        expose: "docker-network"
        notes: "仅容器网络暴露"
    dependencies: []
    backup: true
    monitoring: []

# 全局端口（所有机器）
global_ports:
  - port: 22
    protocol: tcp
    service: ssh
    expose: "0.0.0.0/0"
    notes: "当前未限制来源 IP；密钥登录，root/password disabled，Fail2ban sshd jail；有固定出口 IP 后再收紧。"
