schema_version: 1
host:
  id: LosAngeles
  owner: as
  lifecycle: production
  public_ip: 23.185.200.12

services:
  - service_id: ssh
    name: OpenSSH
    owner: as
    lifecycle: production
    runtime:
      type: systemd
      units: [ssh.service]
      config_paths: [/etc/ssh/sshd_config, /etc/ssh/sshd_config.d/90-ops-hardening.conf]
    ports:
      - { bind: "0.0.0.0", host_port: 22, protocol: tcp, exposure: public }
    observability: { dashboards: [losangeles-security-overview] }

  - service_id: docker
    name: Docker Engine
    owner: as
    lifecycle: production
    runtime:
      type: systemd
      units: [docker.service]
      config_paths: [/etc/docker/daemon.json]
    observability: { prometheus_jobs: [node], dashboards: [losangeles-services-backups] }

  - service_id: nginx
    name: Nginx ingress
    owner: as
    lifecycle: production
    runtime:
      type: systemd
      units: [nginx.service]
      config_paths: [/etc/nginx/nginx.conf, /etc/nginx/sites-enabled]
    ports:
      - { bind: "0.0.0.0", host_port: 80, protocol: tcp, exposure: public }
      - { bind: "0.0.0.0", host_port: 443, protocol: tcp, exposure: public }
    backup: { required: true, jobs: [backup-configs], offsite: R2 }
    observability: { log_jobs: [nginx], dashboards: [losangeles-app-health] }

  - service_id: host-security
    name: Host security audit
    owner: as
    lifecycle: production
    runtime:
      type: systemd
      units: [auditd.service, fail2ban.service]
      config_paths: [/etc/audit, /etc/fail2ban]
    observability:
      log_jobs: [auditd, fail2ban, fail2ban_enriched]
      dashboards: [losangeles-security-overview]

  - service_id: x-ui
    name: x-ui
    owner: as
    lifecycle: production
    runtime:
      type: systemd
      units: [x-ui.service]
      config_paths: [/etc/systemd/system/x-ui.service]
    ports:
      - { bind: 127.0.0.1, host_port: 2096, protocol: tcp, exposure: loopback }
      - { bind: 127.0.0.1, host_port: 46585, protocol: tcp, exposure: loopback }
    backup: { required: true, jobs: [backup-configs] }

  - service_id: xray
    name: Xray
    owner: as
    lifecycle: production
    runtime: { type: child-process, parent_service_id: x-ui }
    ports:
      - { bind: 127.0.0.1, host_port: 10000, protocol: tcp, exposure: loopback }
      - { bind: 127.0.0.1, host_port: 11111, protocol: tcp, exposure: loopback }
      - { bind: 127.0.0.1, host_port: 62789, protocol: tcp, exposure: loopback }
    backup: { required: true, jobs: [backup-configs] }
    observability:
      log_jobs: [xray_access]
      prometheus_jobs: [node]
      dashboards: [losangeles-xray-traffic-audit]
      notes: "流量审计：access log 写 /var/log/xray/access.log 经 Promtail 入 Loki（目的地/用户/时间线完整）；路由按 geosite 分桶到 out-* 出站标签，出站字节经 xray api statsquery(:62789) 采成 xray_outbound_traffic_bytes_total，每用户字节采成 xray_user_traffic_bytes_total（2026-07-21）；仅转发不含加密内容。"

  - service_id: resume-jadeai
    name: Resume JadeAI
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: resume-jadeai
      runtime_compose: /opt/services/resume-jadeai/compose.yml
      controlled_compose: /opt/ops/services/resume-jadeai/compose.yml
      containers: [resume-jadeai-app-1]
    ports:
      - { bind: 127.0.0.1, host_port: 2082, container_port: 3000, protocol: tcp, exposure: loopback }
    backup: { required: true, jobs: [backup-volumes], offsite: R2 }
    observability:
      prometheus_jobs: [blackbox_app_https, blackbox_business_resume_https]
      dashboards: [losangeles-app-health]

  - service_id: account-vault-web
    name: Account Vault web
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: account-vault
      runtime_compose: /opt/services/account-vault/compose.yml
      controlled_compose: /opt/ops/services/account-vault/compose.yml
      containers: [account-vault-web-1]
    ports:
      - { bind: 127.0.0.1, host_port: 8392, container_port: 3001, protocol: tcp, exposure: loopback }
    backup: { required: true, jobs: [backup-configs], offsite: R2 }
    observability:
      prometheus_jobs: [blackbox_app_https, blackbox_business_account_vault_https]
      dashboards: [losangeles-app-health]

  - service_id: account-vault-postgres
    name: Account Vault PostgreSQL
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: account-vault
      runtime_compose: /opt/services/account-vault/compose.yml
      controlled_compose: /opt/ops/services/account-vault/compose.yml
      containers: [account-vault-postgres-1]
    ports:
      - { bind: 127.0.0.1, host_port: 25432, container_port: 5432, protocol: tcp, exposure: loopback }
    data: { type: postgres, volume: sorryiossearch_pgdata, classification: confidential }
    backup: { required: true, jobs: [backup-postgres], offsite: R2 }
    observability: { prometheus_jobs: [postgres], dashboards: [losangeles-datastores] }

  - service_id: areaforge-web
    name: AreaForge web
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: areaforge
      runtime_compose: /opt/areaforge/docker-compose.prod.yml
      controlled_compose: /opt/ops/services/areaforge/compose.yml
      containers: [areaforge-web]
    ports:
      - { bind: 127.0.0.1, host_port: 3020, container_port: 3000, protocol: tcp, exposure: loopback }
    data: { type: files, path: /opt/areaforge, classification: confidential }
    backup: { required: true, jobs: [backup-volumes], offsite: R2 }
    observability:
      prometheus_jobs: [blackbox_app_https]
      dashboards: [losangeles-app-health]

  - service_id: areaforge-postgres
    name: AreaForge PostgreSQL
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: areaforge
      runtime_compose: /opt/areaforge/docker-compose.prod.yml
      controlled_compose: /opt/ops/services/areaforge/compose.yml
      containers: [areaforge-postgres]
    data: { type: postgres, classification: confidential }
    backup: { required: true, jobs: [backup-postgres], offsite: R2 }
    observability: { dashboards: [losangeles-datastores] }

  - service_id: sub2api
    name: Sub2API
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: sub2api
      runtime_compose: /opt/services/sub2api/compose.yml
      controlled_compose: /opt/ops/services/sub2api/compose.yml
      containers: [sub2api]
      observed_version: "0.1.173"
      observed_image_digest: "sha256:7a924a8ecd5ad103d7b2730a3e5f94db5d4f09bb8273f0298ac3e13380bdb3a1"
    ports:
      - { bind: 127.0.0.1, host_port: 8080, container_port: 8080, protocol: tcp, exposure: loopback }
    data: { type: files, path: /var/lib/sub2api/data, classification: confidential }
    backup: { required: true, jobs: [backup-volumes], offsite: R2 }
    observability:
      prometheus_jobs: [blackbox_app_https, blackbox_business_sub2api_https]
      dashboards: [losangeles-app-health, sub2api-slo-capacity]

  - service_id: sub2api-postgres
    name: Sub2API PostgreSQL
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: sub2api
      runtime_compose: /opt/services/sub2api/compose.yml
      controlled_compose: /opt/ops/services/sub2api/compose.yml
      containers: [sub2api-postgres]
    data: { type: postgres, path: /var/lib/sub2api/postgres_data, classification: confidential }
    backup: { required: true, jobs: [backup-postgres], offsite: R2 }
    observability: { prometheus_jobs: [postgres], dashboards: [losangeles-datastores] }

  - service_id: sub2api-redis
    name: Sub2API Redis
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: sub2api
      runtime_compose: /opt/services/sub2api/compose.yml
      controlled_compose: /opt/ops/services/sub2api/compose.yml
      containers: [sub2api-redis]
    data: { type: redis, path: /var/lib/sub2api/redis_data, classification: confidential }
    backup: { required: true, jobs: [backup-redis], offsite: R2 }
    observability: { prometheus_jobs: [redis], dashboards: [losangeles-datastores] }

  - service_id: observability-stack
    name: Prometheus Grafana Loki stack
    owner: as
    lifecycle: production
    runtime:
      type: docker-compose
      compose_project: observability
      runtime_compose: /opt/ops/observability/docker-compose.yml
      controlled_compose: /opt/ops/observability/docker-compose.yml
      containers:
        - prometheus
        - alertmanager
        - grafana
        - loki
        - promtail
        - node-exporter
        - blackbox-exporter
        - postgres-exporter-sub2api
        - postgres-exporter-account-vault
        - redis-exporter-sub2api
    ports:
      - { bind: 127.0.0.1, host_port: 9090, container_port: 9090, protocol: tcp, exposure: loopback }
      - { bind: 127.0.0.1, host_port: 9093, container_port: 9093, protocol: tcp, exposure: loopback }
      - { bind: 127.0.0.1, host_port: 3000, container_port: 3000, protocol: tcp, exposure: loopback }
      - { bind: 127.0.0.1, host_port: 3100, container_port: 3100, protocol: tcp, exposure: loopback }
      # node-exporter host 网络直监听 9100；UFW 仅放行 172.16.0.0/12（Docker 网段），公网默认拒绝
      - { bind: "0.0.0.0", host_port: 9100, protocol: tcp, exposure: firewalled }
    data: { type: metrics-logs, path: /var/lib/observability, classification: operational }
    backup: { required: true, jobs: [backup-volumes, backup-configs], offsite: R2 }
    observability:
      prometheus_jobs: [prometheus, alertmanager, loki, promtail, node, blackbox_https]
      dashboards: [losangeles-host-overview, losangeles-services-backups, losangeles-service-overview, losangeles-observability-selfcheck]
      notes: "Loki 留存 720h/30 天（2026-07-21 起，此前 168h）；critical 告警→GitHub issue 同步 enabled（/var/lib/areasong-ops/credentials/alertmanager-github.env root:root 0600，由 AreaSong Ops 类型化轮换，fine-grained PAT 仅 AreaSong/ops Issues RW，到期日 2027-08-12；5 分钟 cron + 每月演练）；阶段 7 heartbeat/dead-man 复用同一 root-only Issues 凭据，外部 workflow 负责失联通知，已完成生产部署与验收；镜像 CVE 周扫描 .github/workflows/image-cve-scan.yml。"

  - service_id: areasong-ops
    name: AreaSong Ops control plane
    owner: as
    lifecycle: production
    deployment_status: production-validated
    runtime:
      type: systemd-and-docker-compose
      units: [areasong-ops-runner.service]
      compose_project: areasong-ops
      runtime_compose: /opt/services/areasong-ops/compose.yml
      controlled_compose: /opt/ops/services/areasong-ops/deploy/compose.yml
      containers: [areasong-ops-web]
      config_paths: [/etc/areasong-ops/services.json, /etc/areasong-ops/web.env]
      observed_version: phase9
      observed_release_version: "1.0.0"
      observed_revision: "c74fe0c2a19d71db71fd8a8fb8ab84eb9e0a96cf"
      observed_web_image_digest: "sha256:ba98c087a8748cbe8f1b9bfb2aa475a95f2c126d3bb8c17ddb53a895c583a832"
      observed_runner_bundle_sha256: "c301e6f1bf061aa9017da172f4f346fd688eb8e7b6dc377740bf9ff49b60ab47"
    ports:
      - { bind: 127.0.0.1, host_port: 3200, container_port: 8080, protocol: tcp, exposure: loopback }
    data: { type: sqlite-and-operation-evidence, path: /var/lib/areasong-ops, classification: confidential }
    backup: { required: true, jobs: [backup-volumes, backup-configs], offsite: R2 }
    observability:
      prometheus_jobs: [areasong_ops, blackbox_access_policy]
      log_jobs: [docker, syslog, nginx]
      dashboards: [areasong-ops-control-plane]
      notes: "Runner/Web 已于 2026-08-27 在 C2 单人审批窗口完成 release 1.0.0、revision c74fe0c2 生产部署；Web digest 与 Runner bundle 签名复验通过。未认证 Web API 负向请求返回 401；2026-08-27 通过 Cloudflare Access 身份 song80184@gmail.com 完成服务、状态、对象、Fleet 与 Runner 更新视图的 authenticated UI-backed API smoke，实时连接正常，禁用能力按策略保持关闭。AreaForge stop 生命周期 preflight 因 service:areaforge trafficPolicy=null 按门禁拒绝，未改变生产状态。2026-08-27 已通过 la-share 完成 AreaForge 受控 Nginx 站点/snippet 安装、权限校验、nginx -t、reload 与 HTTPS 200 健康检查；traffic 状态保持 running，areaforge-web/postgres healthy。Nginx 仍有两个旧备份符号链接造成重复 server_name 警告，按批准保留。runtime preflight 目前未通过：生产 /opt/ops HEAD=e9b8b3e2，而运行 OPS_BUILD_REVISION=c74fe0c2，revision ancestor 门禁失败；未执行控制面重建或其他服务变更。"

routes:
  - service_id: resume-jadeai
    hostname: resume.areasong.top
    cloudflare_mode: proxied
    observed_origin_policy: cloudflare-only
    desired_origin_policy: cloudflare-only
    nginx_file: /etc/nginx/sites-enabled/cdn.resume.areasong.top.conf
    backend_endpoints: ["http://127.0.0.1:2082"]
    tls_mode: cloudflare-origin-ca
  - service_id: account-vault-web
    hostname: sorryiossearch.areasong.top
    cloudflare_mode: proxied
    observed_origin_policy: cloudflare-only
    desired_origin_policy: cloudflare-only
    nginx_file: /etc/nginx/sites-enabled/cdn.sorryiossearch.areasong.top.conf
    backend_endpoints: ["http://127.0.0.1:8392"]
    tls_mode: cloudflare-origin-ca
  - service_id: observability-stack
    hostname: monitor.areasong.top
    cloudflare_mode: proxied
    observed_origin_policy: cloudflare-only
    desired_origin_policy: cloudflare-only
    nginx_file: /etc/nginx/sites-enabled/monitor.areasong.top.conf
    backend_endpoints: ["http://127.0.0.1:3000"]
    tls_mode: cloudflare-origin-ca
  - service_id: areasong-ops
    hostname: ops.areasong.top
    lifecycle: production
    validation_status: validated
    cloudflare_mode: proxied
    observed_origin_policy: cloudflare-only
    desired_origin_policy: cloudflare-only
    nginx_file: /etc/nginx/sites-enabled/ops.areasong.top.conf
    backend_endpoints: ["http://127.0.0.1:3200"]
    tls_mode: cloudflare-origin-ca
  - service_id: areaforge-web
    hostname: forge.areasong.top
    cloudflare_mode: proxied
    observed_origin_policy: cloudflare-only
    desired_origin_policy: cloudflare-only
    nginx_file: /etc/nginx/sites-enabled/forge.areasong.top.conf
    backend_endpoints: ["http://127.0.0.1:3020"]
    tls_mode: cloudflare-origin-ca
  - service_id: sub2api
    hostname: cpa.areasong.top
    cloudflare_mode: dns-only
    observed_origin_policy: direct
    desired_origin_policy: direct
    nginx_file: /etc/nginx/sites-enabled/direct.cpa.areasong.top.conf
    backend_endpoints: ["http://127.0.0.1:8080"]
    tls_mode: lets-encrypt
  - service_id: x-ui
    hostname: log.areasong.top
    cloudflare_mode: dns-only
    observed_origin_policy: direct
    desired_origin_policy: direct
    nginx_file: /etc/nginx/sites-enabled/direct.log.areasong.top.conf
    backend_endpoints:
      - "https://127.0.0.1:46585"
      - "http://127.0.0.1:10000"
      - "https://127.0.0.1:2096"
    tls_mode: lets-encrypt

config_pairs:
  - { service_id: resume-jadeai, runtime: /opt/services/resume-jadeai/compose.yml, controlled: /opt/ops/services/resume-jadeai/compose.yml, severity: warning }
  - { service_id: account-vault-web, runtime: /opt/services/account-vault/compose.yml, controlled: /opt/ops/services/account-vault/compose.yml, severity: warning }
  - { service_id: areaforge-web, runtime: /opt/areaforge/docker-compose.prod.yml, controlled: /opt/ops/services/areaforge/compose.yml, severity: warning }
  - { service_id: sub2api, runtime: /opt/services/sub2api/compose.yml, controlled: /opt/ops/services/sub2api/compose.yml, severity: warning }
  - { service_id: areasong-ops, runtime: /opt/services/areasong-ops/compose.yml, controlled: /opt/ops/services/areasong-ops/deploy/compose.yml, severity: warning }
