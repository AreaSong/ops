---
- name: Install pinned cosign for Account Vault attestation verification
  hosts: LosAngeles
  become: true
  gather_facts: true
  vars:
    cosign_version: "3.1.1"
    cosign_binary: cosign-linux-amd64
    cosign_sha256: "ae1ecd212663f3693ad9edf8b1a183900c9a52d3155ba6e354237f9a0f6463fc"
    cosign_cache_dir: /var/cache/ops/cosign
  tasks:
    - name: Require the audited amd64 server architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: "Pinned cosign artifact only supports x86_64."

    - name: Install attestation verification dependencies
      ansible.builtin.package:
        name:
          - jq
        state: present

    - name: Create the root-owned cosign cache
      ansible.builtin.file:
        path: "{{ cosign_cache_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the pinned cosign binary
      ansible.builtin.get_url:
        url: "https://github.com/sigstore/cosign/releases/download/v{{ cosign_version }}/{{ cosign_binary }}"
        dest: "{{ cosign_cache_dir }}/{{ cosign_binary }}"
        checksum: "sha256:{{ cosign_sha256 }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install the verified cosign binary
      ansible.builtin.copy:
        src: "{{ cosign_cache_dir }}/{{ cosign_binary }}"
        dest: /usr/local/bin/cosign
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Verify the installed cosign version
      ansible.builtin.command: /usr/local/bin/cosign version
      register: cosign_version_output
      changed_when: false
      failed_when: "('GitVersion:    v' ~ cosign_version) not in cosign_version_output.stdout"

    - name: Verify the jq dependency
      ansible.builtin.command: jq --version
      changed_when: false
