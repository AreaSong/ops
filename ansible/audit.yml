---
- name: Audit server compliance against baseline
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - roles/security/defaults/main.yml
  tasks:
    - name: Check timezone is UTC
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: tz_result
      changed_when: false

    - name: Report timezone deviation
      ansible.builtin.debug:
        msg: "FAIL: timezone is {{ tz_result.stdout }}, expected UTC"
      when: tz_result.stdout != "UTC"

    - name: Check SSH PermitRootLogin
      ansible.builtin.command: sshd -T
      register: sshd_config
      changed_when: false

    - name: Report root login enabled
      ansible.builtin.debug:
        msg: "FAIL: PermitRootLogin is enabled"
      when: "'permitrootlogin yes' in sshd_config.stdout"

    - name: Check SSH password authentication
      ansible.builtin.debug:
        msg: "FAIL: PasswordAuthentication is enabled"
      when: "'passwordauthentication yes' in sshd_config.stdout"

    - name: Check fail2ban is running
      ansible.builtin.systemd:
        name: fail2ban
      register: fail2ban_status
      check_mode: true
      failed_when: false

    - name: Report fail2ban not running
      ansible.builtin.debug:
        msg: "FAIL: fail2ban is not active"
      when: fail2ban_status.status is not defined or fail2ban_status.status.ActiveState != "active"

    - name: Check auditd service state
      ansible.builtin.command: systemctl is-active auditd
      register: auditd_status
      changed_when: false
      failed_when: false

    - name: Check auditd service enablement
      ansible.builtin.command: systemctl is-enabled auditd
      register: auditd_enabled
      changed_when: false
      failed_when: false

    - name: Check auditd kernel status
      ansible.builtin.command: auditctl -s
      register: auditd_kernel_status
      changed_when: false
      failed_when: false

    - name: Check loaded audit rules
      ansible.builtin.command: auditctl -l
      register: auditd_rules
      changed_when: false
      failed_when: false

    - name: Require healthy auditd service and kernel state
      ansible.builtin.assert:
        that:
          - auditd_status.rc == 0
          - auditd_status.stdout == 'active'
          - auditd_enabled.rc == 0
          - auditd_enabled.stdout == 'enabled'
          - auditd_kernel_status.rc == 0
          - auditd_kernel_status.stdout is search('(?m)^enabled 1$')
          - auditd_kernel_status.stdout is search('(?m)^lost 0$')
          - auditd_rules.rc == 0
          - auditd_rules.stdout | length > 0
        fail_msg: "auditd service, kernel state, or loaded-rule validation failed."

    - name: Require every baseline audit key
      ansible.builtin.assert:
        that:
          - auditd_rules.stdout is search('(^|\\s)(-k\\s+|key=)' ~ item ~ '(\\s|$)')
        fail_msg: "auditd baseline key is missing: {{ item }}"
      loop: "{{ auditd_required_keys }}"

    - name: Check Compose-managed node-exporter is running
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' }}"
          - node-exporter
      register: ne_status
      changed_when: false
      failed_when: false

    - name: Report node-exporter not running or unhealthy
      ansible.builtin.debug:
        msg: "FAIL: Compose-managed node-exporter is not running and healthy"
      when: ne_status.rc != 0 or ne_status.stdout != "running healthy"

    - name: Check disk usage
      ansible.builtin.shell: df --output=pcent,target / | tail -n +2 | awk '$1+0 > 85 {print}'
      register: disk_usage
      changed_when: false

    - name: Report high disk usage
      ansible.builtin.debug:
        msg: "WARN: disk usage > 85%: {{ disk_usage.stdout_lines }}"
      when: disk_usage.stdout_lines | length > 0

    - name: Check required directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dir_check
      loop:
        - /opt/ops
        - /opt/compose
        - /data
        - /var/log/backup
      changed_when: false

    - name: Report missing directories
      ansible.builtin.debug:
        msg: "FAIL: directory {{ item.item }} does not exist"
      loop: "{{ dir_check.results }}"
      when: not item.stat.exists

    - name: Audit summary
      ansible.builtin.debug:
        msg: "Audit complete for {{ inventory_hostname }}. Review FAIL/WARN messages above."
