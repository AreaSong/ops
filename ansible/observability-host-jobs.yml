---
- name: Install LosAngeles observability host jobs
  hosts: LosAngeles
  become: true
  gather_facts: false
  vars:
    # LosAngeles 的 Worker、追加式写入 token 和独立只读回验 token 已就绪。
    # 生产默认保持开启，避免未显式传参的重复部署静默移除归档任务与告警 gate。
    compliance_archive_enabled: true
    # 生产凭据由 AreaSong Ops 类型化轮换闭环管理；临时停用需显式 -e alertmanager_github_issues_enabled=false
    alertmanager_github_issues_enabled: true
    host_jobs_release_id: ""
    host_jobs_root: /var/lib/ops/observability-host-jobs
    host_jobs_generation: "{{ host_jobs_root }}/generations/{{ host_jobs_release_id }}"
    host_jobs_current: "{{ host_jobs_root }}/current"
    collector_files:
      - { name: write-daily-ops-audit.sh, mode: "0755" }
      - { name: daily_ops_audit.py, mode: "0755" }
      - { name: daily_ops_audit_common.py, mode: "0644" }
      - { name: daily_ops_audit_collectors.py, mode: "0644" }
      - { name: daily_ops_audit_reporting.py, mode: "0644" }
      - { name: write-docker-metrics.sh, mode: "0755" }
      - { name: docker_metrics.py, mode: "0755" }
      - { name: runtime_snapshot.py, mode: "0755" }
      - { name: business_error_log.py, mode: "0755" }
      - { name: cloudflare_ip_metrics.py, mode: "0755" }
      - { name: alertmanager_runtime_input.py, mode: "0755" }
      - { name: alertmanager_github_issues.py, mode: "0755" }
      - { name: github_external_heartbeat.py, mode: "0755" }
      - { name: write-business-log-metrics.sh, mode: "0755" }
      - { name: write-cloudflare-origin-cert-metrics.sh, mode: "0755" }
      - { name: write-fail2ban-enriched-log.py, mode: "0755" }
      - { name: write-security-metrics.sh, mode: "0755" }
      - { name: write-sub2api-capacity-metrics.sh, mode: "0755" }
      - { name: write-xray-traffic-metrics.sh, mode: "0755" }
      - { name: write-backup-metrics.sh, mode: "0755" }
      - { name: prune-docker-build-cache.sh, mode: "0755" }
    shell_collector_names:
      - write-daily-ops-audit.sh
      - write-docker-metrics.sh
      - write-business-log-metrics.sh
      - write-cloudflare-origin-cert-metrics.sh
      - write-security-metrics.sh
      - write-sub2api-capacity-metrics.sh
      - write-xray-traffic-metrics.sh
      - write-backup-metrics.sh
      - prune-docker-build-cache.sh
    cron_files:
      - ops-daily-ops-audit
      - ops-docker-metrics
      - ops-runtime-snapshot
      - ops-business-error-log
      - ops-cloudflare-ip-metrics
      - ops-alertmanager-runtime-input
      - ops-business-log-metrics
      - ops-cloudflare-origin-cert-metrics
      - ops-fail2ban-enriched
      - ops-security-metrics
      - ops-sub2api-capacity-metrics
      - ops-xray-traffic-metrics
      - ops-docker-build-cache-prune
    alertmanager_github_cron_files:
      - ops-alertmanager-github-issues
      - ops-alertmanager-github-simulation
      - ops-github-external-heartbeat
    backup_files:
      - { name: run-backup-job.sh, mode: "0755" }
      - { name: backup-postgres.sh, mode: "0755" }
      - { name: backup-redis.sh, mode: "0755" }
      - { name: backup-configs.sh, mode: "0755" }
      - { name: backup-volumes.sh, mode: "0755" }
      - { name: backup_manifest.py, mode: "0755" }
      - { name: create-backup-manifest.sh, mode: "0755" }
      - { name: sync-r2.sh, mode: "0755" }
      - { name: verify-backup-set-r2.sh, mode: "0755" }
      - { name: migrate-legacy-root-crontab.py, mode: "0755" }
    backup_shell_names:
      - run-backup-job.sh
      - backup-postgres.sh
      - backup-redis.sh
      - backup-configs.sh
      - backup-volumes.sh
      - create-backup-manifest.sh
      - sync-r2.sh
      - verify-backup-set-r2.sh
    backup_cron_files:
      - ops-backup-postgres
      - ops-backup-redis
      - ops-backup-configs
      - ops-backup-volumes
      - ops-backup-metrics
      - ops-backup-manifest
      - ops-backup-r2
    compliance_archive_files:
      - { name: compliance_log_archive.py, mode: "0755" }
      - { name: archive-compliance-logs.sh, mode: "0755" }
      - { name: verify-compliance-log-archive.sh, mode: "0755" }
    compliance_archive_shell_names:
      - archive-compliance-logs.sh
      - verify-compliance-log-archive.sh
    compliance_archive_cron_files:
      - ops-compliance-log-archive
  tasks:
    - name: Inspect the controller Git worktree before staging host jobs
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - "{{ playbook_dir }}/.."
          - status
          - --porcelain=v1
          - --untracked-files=all
      register: host_jobs_git_status
      changed_when: false
      check_mode: false

    - name: Require a clean controller Git worktree
      ansible.builtin.assert:
        that:
          - host_jobs_git_status.stdout == ''
        fail_msg: Refusing to deploy host jobs from a dirty or untracked /opt/ops checkout.

    - name: Read the exact controller Git commit
      ansible.builtin.command:
        argv: [/usr/bin/git, -C, "{{ playbook_dir }}/..", rev-parse, --verify, HEAD]
      register: host_jobs_git_head
      changed_when: false
      check_mode: false

    - name: Record the immutable host-job generation identity
      ansible.builtin.set_fact:
        host_jobs_release_id: "{{ host_jobs_git_head.stdout | trim }}"

    - name: Inspect the requested host-job generation and current pointer
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ host_jobs_generation }}"
        - "{{ host_jobs_current }}"
      register: host_jobs_pointer_state

    - name: Refuse to overwrite an existing inactive generation
      ansible.builtin.assert:
        that:
          - >-
            not host_jobs_pointer_state.results[0].stat.exists or
            (host_jobs_pointer_state.results[1].stat.islnk | default(false) and
            host_jobs_pointer_state.results[1].stat.lnk_target == 'generations/' ~ host_jobs_release_id)
        fail_msg: The requested host-job generation exists but is not the active current generation.

    - name: Determine whether the requested generation is already active
      ansible.builtin.set_fact:
        host_jobs_generation_already_active: >-
          {{ (host_jobs_pointer_state.results[0].stat.exists | default(false)) and
             (host_jobs_pointer_state.results[1].stat.islnk | default(false)) and
             host_jobs_pointer_state.results[1].stat.lnk_target == ('generations/' ~ host_jobs_release_id) }}

    - name: Require a commit-addressed host-job generation
      ansible.builtin.assert:
        that:
          - host_jobs_release_id is match('^[0-9a-f]{40}$')
        fail_msg: The controller checkout must have a valid Git commit before host jobs are deployed.

    - name: Create observability host and generation directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /var/log/observability, group: adm, mode: "0750" }
        - { path: /var/log/backup, group: adm, mode: "0750" }
        - { path: /var/log/business-errors, group: adm, mode: "0750" }
        - { path: /var/lib/observability/promtail, group: root, mode: "0750" }
        - { path: /var/lib/observability, group: root, mode: "0750" }
        - { path: /var/lib/node_exporter/textfile_collector, group: root, mode: "0755" }
        - { path: /var/lib/ops/runtime, group: root, mode: "0755" }
        - { path: /var/backups/ops/compliance-logs, group: root, mode: "0700" }
        - { path: "{{ host_jobs_root }}/generations", group: root, mode: "0755" }
        - { path: "{{ host_jobs_generation }}/observability/scripts", group: root, mode: "0755" }
        - { path: "{{ host_jobs_generation }}/scripts/backup", group: root, mode: "0755" }
        - { path: "{{ host_jobs_generation }}/observability/cron", group: root, mode: "0755" }
        - { path: "{{ host_jobs_generation }}/scripts/backup/cron", group: root, mode: "0755" }
        - { path: "{{ host_jobs_generation }}/logrotate", group: root, mode: "0755" }
      when: >-
        not (host_jobs_generation_already_active | bool) or item.path in [
          '/var/log/observability', '/var/log/backup', '/var/log/business-errors',
          '/var/lib/observability/promtail', '/var/lib/observability',
          '/var/lib/node_exporter/textfile_collector', '/var/lib/ops/runtime',
          '/var/backups/ops/compliance-logs', host_jobs_root + '/generations'
        ]

    - name: Stage observability collector generation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../observability/scripts/{{ item.name }}"
        dest: "{{ host_jobs_generation }}/observability/scripts/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop: "{{ collector_files }}"
      when: not host_jobs_generation_already_active | bool

    - name: Validate staged collector shell syntax
      ansible.builtin.command:
        argv:
          - /usr/bin/bash
          - -n
          - "{{ host_jobs_generation }}/observability/scripts/{{ item }}"
      loop: "{{ shell_collector_names }}"
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Stage observability cron generation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../observability/cron/{{ item }}"
        dest: "{{ host_jobs_generation }}/observability/cron/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ cron_files + alertmanager_github_cron_files }}"
      when: not host_jobs_generation_already_active | bool

    - name: Stage core backup generation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/backup/{{ item.name }}"
        dest: "{{ host_jobs_generation }}/scripts/backup/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop: "{{ backup_files }}"
      when: not host_jobs_generation_already_active | bool

    - name: Validate staged core backup shell syntax
      ansible.builtin.command:
        argv:
          - /usr/bin/bash
          - -n
          - "{{ host_jobs_generation }}/scripts/backup/{{ item }}"
      loop: "{{ backup_shell_names }}"
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Validate staged backup manifest entry point
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/scripts/backup/backup_manifest.py"
          - --help
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Validate staged root crontab migration entry point
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/scripts/backup/migrate-legacy-root-crontab.py"
          - --help
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Stage backup cron generation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/backup/cron/{{ item }}"
        dest: "{{ host_jobs_generation }}/scripts/backup/cron/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ backup_cron_files + compliance_archive_cron_files }}"
      when: not host_jobs_generation_already_active | bool

    - name: Validate staged daily audit Python imports
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/daily_ops_audit.py"
          - --help
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Validate staged runtime snapshot inventory
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/runtime_snapshot.py"
          - --validate-only
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
        ASSET_INVENTORY_PATH: /opt/ops/inventory/losangeles-assets.yaml
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Validate staged business error collector
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/business_error_log.py"
          - --validate-only
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Validate staged Cloudflare IP collector
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/cloudflare_ip_metrics.py"
          - --validate-only
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
        CLOUDFLARE_IP_CONFIG_DIR: /opt/ops/security/cloudflare
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Validate staged Alertmanager GitHub Issue entry point
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/alertmanager_github_issues.py"
          - --validate-only
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - not host_jobs_generation_already_active | bool
        - not ansible_check_mode

    - name: Stage observability log rotation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../observability/logrotate/ops-observability"
        dest: "{{ host_jobs_generation }}/logrotate/ops-observability"
        owner: root
        group: root
        mode: "0644"
      when: not host_jobs_generation_already_active | bool

    - name: Validate staged observability log rotation
      ansible.builtin.command:
        argv:
          - /usr/sbin/logrotate
          - --debug
          - "{{ host_jobs_generation }}/logrotate/ops-observability"
      changed_when: false
      when:
        - not ansible_check_mode
        - not host_jobs_generation_already_active | bool

    - name: Inspect the Alertmanager GitHub Issue sync credential file
      ansible.builtin.stat:
        path: /var/lib/areasong-ops/credentials/alertmanager-github.env
      register: alertmanager_github_credential
      when: alertmanager_github_issues_enabled | bool

    - name: Require a root-only Alertmanager GitHub Issue sync credential
      ansible.builtin.assert:
        that:
          - alertmanager_github_credential.stat.exists
          - alertmanager_github_credential.stat.pw_name == 'root'
          - alertmanager_github_credential.stat.gr_name == 'root'
          - alertmanager_github_credential.stat.mode == '0600'
        fail_msg: /var/lib/areasong-ops/credentials/alertmanager-github.env must be root:root mode 0600 before enabling Issue sync.
      when: alertmanager_github_issues_enabled | bool

    - name: Validate the enabled Alertmanager GitHub Issue sync configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/alertmanager_github_issues.py"
          - --config
          - /var/lib/areasong-ops/credentials/alertmanager-github.env
          - --validate-only
          - --require-enabled
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - alertmanager_github_issues_enabled | bool
        - not ansible_check_mode

    - name: Validate staged Alertmanager runtime input entry point
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/alertmanager_runtime_input.py"
          - --validate-only
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - not ansible_check_mode
        - not host_jobs_generation_already_active | bool

    - name: Validate the enabled external heartbeat configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/observability/scripts/github_external_heartbeat.py"
          - --config
          - /var/lib/areasong-ops/credentials/alertmanager-github.env
          - --validate-only
          - --require-enabled
      environment:
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: false
      when:
        - alertmanager_github_issues_enabled | bool
        - not ansible_check_mode

    - name: Verify compliance archive credential files before enabling its cron
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/ops/compliance-archive.env
        - /etc/ops/compliance-archive-verify.env
      register: compliance_archive_credentials
      when: compliance_archive_enabled | bool

    - name: Require root-only compliance archive credential files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
        fail_msg: "Compliance archive credential is missing or not root-only: {{ item.item }}"
      loop: "{{ compliance_archive_credentials.results | default([]) }}"
      when: compliance_archive_enabled | bool

    - name: Stage compliance archive generation
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/backup/{{ item.name }}"
        dest: "{{ host_jobs_generation }}/scripts/backup/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop: "{{ compliance_archive_files }}"
      when:
        - compliance_archive_enabled | bool
        - not host_jobs_generation_already_active | bool

    - name: Validate staged compliance archive shell syntax
      ansible.builtin.command:
        argv:
          - /usr/bin/bash
          - -n
          - "{{ host_jobs_generation }}/scripts/backup/{{ item }}"
      loop: "{{ compliance_archive_shell_names }}"
      changed_when: false
      when:
        - compliance_archive_enabled | bool
        - not ansible_check_mode
        - not host_jobs_generation_already_active | bool

    - name: Validate staged compliance archive Python entry point
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_generation }}/scripts/backup/compliance_log_archive.py"
          - --help
      changed_when: false
      when:
        - compliance_archive_enabled | bool
        - not ansible_check_mode
        - not host_jobs_generation_already_active | bool

    - name: Build the immutable generation checksum manifest
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ host_jobs_generation }}"
        cmd: |
          set -euo pipefail
          find . -type f \
            ! -name generation.sha256 \
            ! -name generation.sha256.tmp \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > generation.sha256.tmp
          chmod 0644 generation.sha256.tmp
          mv generation.sha256.tmp generation.sha256
      changed_when: true
      when:
        - not ansible_check_mode
        - not host_jobs_generation_already_active | bool

    - name: Verify the immutable generation checksum manifest
      ansible.builtin.command:
        argv: [/usr/bin/sha256sum, --check, generation.sha256]
        chdir: "{{ host_jobs_generation }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Create the next host-job generation pointer
      ansible.builtin.file:
        src: "generations/{{ host_jobs_release_id }}"
        dest: "{{ host_jobs_root }}/.current-{{ host_jobs_release_id }}"
        state: link
        force: true
        owner: root
        group: root
      when:
        - not ansible_check_mode
        - not host_jobs_generation_already_active | bool

    - name: Atomically activate the validated host-job generation
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "import os, sys; os.replace(sys.argv[1], sys.argv[2])"
          - "{{ host_jobs_root }}/.current-{{ host_jobs_release_id }}"
          - "{{ host_jobs_current }}"
      when:
        - not ansible_check_mode
        - not host_jobs_generation_already_active | bool

    - name: Install observability cron jobs
      ansible.builtin.copy:
        src: >-
          {{ (playbook_dir ~ '/../observability/cron/' ~ item)
             if ansible_check_mode
             else (host_jobs_current ~ '/observability/cron/' ~ item) }}
        dest: "/etc/cron.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
        remote_src: "{{ not ansible_check_mode }}"
      loop: "{{ cron_files }}"
      register: cron_copy_results

    - name: Install Alertmanager GitHub Issue sync cron jobs
      ansible.builtin.copy:
        src: >-
          {{ (playbook_dir ~ '/../observability/cron/' ~ item)
             if ansible_check_mode
             else (host_jobs_current ~ '/observability/cron/' ~ item) }}
        dest: "/etc/cron.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
        remote_src: "{{ not ansible_check_mode }}"
      loop: "{{ alertmanager_github_cron_files }}"
      register: alertmanager_github_cron_results
      when: alertmanager_github_issues_enabled | bool

    - name: Remove Alertmanager GitHub Issue sync cron jobs when disabled
      ansible.builtin.file:
        path: "/etc/cron.d/{{ item }}"
        state: absent
      loop: "{{ alertmanager_github_cron_files }}"
      when: not (alertmanager_github_issues_enabled | bool)

    - name: Remove stale Alertmanager GitHub Issue sync metrics when disabled
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector/alertmanager-github-issues.prom
        state: absent
      when: not (alertmanager_github_issues_enabled | bool)

    - name: Install validated observability log rotation
      ansible.builtin.copy:
        src: >-
          {{ (playbook_dir ~ '/../observability/logrotate/ops-observability')
             if ansible_check_mode
             else (host_jobs_current ~ '/logrotate/ops-observability') }}
        dest: /etc/logrotate.d/ops-observability
        owner: root
        group: root
        mode: "0644"
        backup: true
        remote_src: "{{ not ansible_check_mode }}"
      register: logrotate_copy_result

    - name: Install backup cron jobs
      ansible.builtin.copy:
        src: >-
          {{ (playbook_dir ~ '/../scripts/backup/cron/' ~ item)
             if ansible_check_mode
             else (host_jobs_current ~ '/scripts/backup/cron/' ~ item) }}
        dest: "/etc/cron.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
        remote_src: "{{ not ansible_check_mode }}"
      loop: "{{ backup_cron_files }}"
      register: backup_cron_results

    - name: Migrate exact legacy backup jobs out of root crontab
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ host_jobs_current }}/scripts/backup/migrate-legacy-root-crontab.py"
          - --apply
          - --backup-dir
          - /var/backups/ops/configs
          - --release-id
          - "{{ host_jobs_release_id }}"
      register: legacy_backup_cron_migration
      changed_when: "'migrated_lines=' in legacy_backup_cron_migration.stdout"
      when: not ansible_check_mode

    - name: Inspect active compliance archive scripts before installing its cron
      ansible.builtin.stat:
        path: "{{ host_jobs_current }}/scripts/backup/{{ item.name }}"
      loop: "{{ compliance_archive_files }}"
      register: active_compliance_archive_scripts
      when:
        - compliance_archive_enabled | bool
        - not ansible_check_mode

    - name: Require active compliance archive scripts before installing its cron
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.pw_name == 'root'
          - item.stat.mode == item.item.mode
        fail_msg: >-
          Refusing to install the compliance archive cron because the active generation
          is missing a validated script: {{ item.item.name }}
      loop: "{{ active_compliance_archive_scripts.results | default([]) }}"
      when:
        - compliance_archive_enabled | bool
        - not ansible_check_mode

    - name: Remove the compliance archive activation gate while changing its deployment
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector/compliance-log-archive-configured.prom
        state: absent
      when:
        - compliance_archive_enabled | bool
        - not (host_jobs_generation_already_active | bool)

    - name: Disable the compliance archive cron when the feature is disabled
      ansible.builtin.file:
        path: "/etc/cron.d/{{ item }}"
        state: absent
      loop: "{{ compliance_archive_cron_files }}"
      when: not (compliance_archive_enabled | bool)

    - name: Remove the compliance archive activation gate when the feature is disabled
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector/compliance-log-archive-configured.prom
        state: absent
      when: not (compliance_archive_enabled | bool)

    - name: Install compliance archive cron job
      ansible.builtin.copy:
        src: >-
          {{ (playbook_dir ~ '/../scripts/backup/cron/' ~ item)
             if ansible_check_mode
             else (host_jobs_current ~ '/scripts/backup/cron/' ~ item) }}
        dest: "/etc/cron.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
        remote_src: "{{ not ansible_check_mode }}"
      loop: "{{ compliance_archive_cron_files }}"
      register: compliance_archive_cron_results
      when: compliance_archive_enabled | bool

    - name: Publish the compliance archive activation gate after successful deployment
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/textfile_collector/compliance-log-archive-configured.prom
        owner: root
        group: root
        mode: "0644"
        content: |
          # HELP compliance_log_archive_configured Whether the compliance archive cron and credentials are configured.
          # TYPE compliance_log_archive_configured gauge
          compliance_log_archive_configured 1
        backup: true
      register: compliance_archive_activation_metric
      when: compliance_archive_enabled | bool

    - name: Report the active host-job generation
      ansible.builtin.debug:
        msg: "host_jobs_current={{ host_jobs_current }} generation={{ host_jobs_release_id }}"

    - name: Report cron backup paths
      ansible.builtin.debug:
        msg: "{{ item.item }} backup={{ item.backup_file | default('none (new file)') }}"
      loop: "{{ cron_copy_results.results }}"

    - name: Report logrotate backup path
      ansible.builtin.debug:
        msg: "ops-observability backup={{ logrotate_copy_result.backup_file | default('none (new file)') }}"

    - name: Report backup cron backup paths
      ansible.builtin.debug:
        msg: "{{ item.item }} backup={{ item.backup_file | default('none (new file)') }}"
      loop: "{{ backup_cron_results.results }}"

    - name: Report compliance archive cron backup paths
      ansible.builtin.debug:
        msg: "{{ item.item }} backup={{ item.backup_file | default('none (new file)') }}"
      loop: "{{ compliance_archive_cron_results.results | default([]) }}"
      when: compliance_archive_enabled | bool

    - name: Report compliance archive activation metric backup path
      ansible.builtin.debug:
        msg: >-
          compliance-log-archive-configured backup={{ compliance_archive_activation_metric.backup_file | default('none (new file)') }}
      when: compliance_archive_enabled | bool
