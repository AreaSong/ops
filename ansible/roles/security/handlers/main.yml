---
- name: reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart auditd
  ansible.builtin.command: /usr/sbin/service auditd restart
  changed_when: true

- name: load audit rules
  ansible.builtin.command: /sbin/augenrules --load
  changed_when: true
