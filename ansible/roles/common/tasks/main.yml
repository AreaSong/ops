---
- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Gather time synchronization service facts
  ansible.builtin.service_facts:

- name: Select the existing time synchronization service
  ansible.builtin.set_fact:
    ops_time_sync_service: >-
      {{
        'chrony' if 'chrony.service' in ansible_facts.services else
        'chronyd' if 'chronyd.service' in ansible_facts.services else
        'systemd-timesyncd' if 'systemd-timesyncd.service' in ansible_facts.services else
        ('chrony' if ansible_os_family == 'Debian' else 'chronyd')
      }}
    ops_time_sync_service_present: >-
      {{
        'chrony.service' in ansible_facts.services or
        'chronyd.service' in ansible_facts.services or
        'systemd-timesyncd.service' in ansible_facts.services
      }}

- name: Install chrony when no time synchronization service exists
  ansible.builtin.package:
    name: chrony
    state: present
  when: not ops_time_sync_service_present

- name: Ensure the selected time synchronization service is running
  ansible.builtin.systemd:
    name: "{{ ops_time_sync_service }}"
    state: started
    enabled: true
  when: ops_time_sync_service_present or not ansible_check_mode

- name: Create standard directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/apps
    - /opt/compose
    - /opt/ops
    - /data
    - /var/log/backup

- name: Configure journald retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/ops-retention.conf
    content: |
      [Journal]
      SystemMaxUse=500M
      MaxRetentionSec=7day
    mode: "0644"
  notify: restart journald

- name: Configure sysctl baseline
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/99-ops-baseline.conf
    regexp: '^{{ item.name | regex_escape }}\s*='
    line: "{{ item.name }} = {{ item.value }}"
    create: true
    mode: "0644"
  loop: "{{ ops_sysctl_baseline + ops_sysctl_extra }}"
  notify: apply sysctl

# LosAngeles 高延迟代理路径：有证据后再调（见 standards/09 §25.2）
- name: Configure TCP tuning for high-latency paths
  ansible.builtin.copy:
    dest: /etc/sysctl.d/98-ops-tcp-tuning.conf
    content: |
      # High-latency / high-bandwidth proxy path (BDP-aware buffers)
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216
      net.ipv4.tcp_rmem = 4096 131072 16777216
      net.ipv4.tcp_wmem = 4096 16384 16777216
      net.ipv4.tcp_slow_start_after_idle = 0
      net.ipv4.tcp_mtu_probing = 1
      vm.swappiness = 10
    mode: "0644"
  notify: apply sysctl
