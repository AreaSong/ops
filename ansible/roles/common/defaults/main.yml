---
ops_sysctl_rp_filter: 1

ops_sysctl_baseline:
  - { name: net.ipv4.tcp_syncookies, value: 1 }
  - { name: net.ipv4.conf.all.rp_filter, value: "{{ ops_sysctl_rp_filter }}" }
  - { name: net.ipv4.conf.default.rp_filter, value: "{{ ops_sysctl_rp_filter }}" }
  - { name: net.ipv4.icmp_echo_ignore_broadcasts, value: 1 }
  - { name: vm.overcommit_memory, value: 1 }
  - { name: fs.file-max, value: 65535 }

ops_sysctl_extra: []
