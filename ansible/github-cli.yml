---
- name: Install pinned GitHub CLI for Account Vault provenance verification
  hosts: LosAngeles
  become: true
  gather_facts: true
  vars:
    github_cli_version: "2.96.0"
    github_cli_archive: "gh_{{ github_cli_version }}_linux_amd64.tar.gz"
    github_cli_sha256: "83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60"
    github_cli_cache_dir: /var/cache/ops/github-cli
  tasks:
    - name: Require the audited amd64 server architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: "Pinned GitHub CLI artifact only supports x86_64."

    - name: Install provenance verification dependencies
      ansible.builtin.package:
        name:
          - jq
        state: present

    - name: Create the root-owned GitHub CLI cache
      ansible.builtin.file:
        path: "{{ github_cli_cache_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the pinned GitHub CLI archive
      ansible.builtin.get_url:
        url: "https://github.com/cli/cli/releases/download/v{{ github_cli_version }}/{{ github_cli_archive }}"
        dest: "{{ github_cli_cache_dir }}/{{ github_cli_archive }}"
        checksum: "sha256:{{ github_cli_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Extract the verified GitHub CLI archive
      ansible.builtin.unarchive:
        src: "{{ github_cli_cache_dir }}/{{ github_cli_archive }}"
        dest: "{{ github_cli_cache_dir }}"
        remote_src: true
        creates: "{{ github_cli_cache_dir }}/gh_{{ github_cli_version }}_linux_amd64/bin/gh"

    - name: Install the verified GitHub CLI binary
      ansible.builtin.copy:
        src: "{{ github_cli_cache_dir }}/gh_{{ github_cli_version }}_linux_amd64/bin/gh"
        dest: /usr/local/bin/gh
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Verify the installed GitHub CLI version
      ansible.builtin.command: /usr/local/bin/gh --version
      register: github_cli_version_output
      changed_when: false
      failed_when: "('gh version ' ~ github_cli_version) not in github_cli_version_output.stdout"

    - name: Verify the jq dependency
      ansible.builtin.command: jq --version
      changed_when: false
