global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod
    host: LosAngeles

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          instance: LosAngeles

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: LosAngeles

  - job_name: blackbox_https
    metrics_path: /probe
    params:
      module:
        - http_2xx_tls
    static_configs:
      - targets:
          - https://monitor.areasong.top/
          - https://log.areasong.top/
        labels:
          instance: LosAngeles
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter-sub2api:9187
        labels:
          instance: sub2api-postgres
          service: sub2api
      - targets:
          - postgres-exporter-account-vault:9187
        labels:
          instance: account-vault-postgres
          service: account-vault

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter-sub2api:9121
        labels:
          instance: sub2api-redis
          service: sub2api
