global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod
    host: LosAngeles

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          instance: LosAngeles

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: LosAngeles

  - job_name: blackbox_https
    metrics_path: /probe
    params:
      module:
        - http_2xx_tls
    static_configs:
      - targets:
          - https://monitor.areasong.top/
          - https://log.areasong.top/
        labels:
          instance: LosAngeles
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_app_https
    metrics_path: /probe
    params:
      module:
        - http_2xx_tls
    static_configs:
      - targets:
          - https://resume.areasong.top/
        labels:
          instance: resume-jadeai
          service: resume-jadeai
          check: homepage
      - targets:
          - https://sorryiossearch.areasong.top/health
        labels:
          instance: account-vault-web
          service: account-vault
          check: health
      - targets:
          - https://cpa.areasong.top/health
        labels:
          instance: sub2api
          service: sub2api
          check: health
      - targets:
          - https://forge.areasong.top/
        labels:
          instance: areaforge-web
          service: areaforge
          check: login-redirect
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_business_resume_https
    metrics_path: /probe
    params:
      module:
        - http_resume_jadeai_home_tls
    static_configs:
      - targets:
          - https://resume.areasong.top/zh
        labels:
          instance: resume-jadeai
          service: resume-jadeai
          check: resume-home
          journey: public-home
          scope: business
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_business_account_vault_https
    metrics_path: /probe
    params:
      module:
        - http_account_vault_business_tls
    static_configs:
      - targets:
          - https://sorryiossearch.areasong.top/login
        labels:
          instance: account-vault-web
          service: account-vault
          check: login-page
          journey: login
          scope: business
      - targets:
          - https://sorryiossearch.areasong.top/api/auth/status
        labels:
          instance: account-vault-web
          service: account-vault
          check: auth-status-api
          journey: login
          scope: business
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_business_sub2api_https
    metrics_path: /probe
    params:
      module:
        - http_sub2api_business_tls
    static_configs:
      - targets:
          - https://cpa.areasong.top/login
        labels:
          instance: sub2api
          service: sub2api
          check: login-page
          journey: login
          scope: business
      - targets:
          - https://cpa.areasong.top/health
        labels:
          instance: sub2api
          service: sub2api
          check: health-json
          journey: health
          scope: business
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter-sub2api:9187
        labels:
          instance: sub2api-postgres
          service: sub2api
      - targets:
          - postgres-exporter-account-vault:9187
        labels:
          instance: account-vault-postgres
          service: account-vault

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter-sub2api:9121
        labels:
          instance: sub2api-redis
          service: sub2api
