rule_files:
  - ../backup-integrity.yml

evaluation_interval: 1m

tests:
  - name: missing archive activation gate is critical
    interval: 1m
    alert_rule_test:
      - eval_time: 16m
        alertname: ComplianceLogArchiveNotConfigured
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "合规日志归档尚未配置"
              description: "受管归档 cron、凭据或启用开关缺失；恢复部署前，无法信任归档时效告警。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

  - name: configured archive reports missing verification metrics
    interval: 1m
    input_series:
      - series: 'compliance_log_archive_configured{instance="losangeles",job="node-exporter"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 31m
        alertname: ComplianceLogArchiveStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "不可变合规日志归档校验已过期"
              description: "每日审计、认证和 Nginx 日志归档未能在 36 小时内完成独立远程回读。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 31m
        alertname: ComplianceLogArchiveDayGap
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "合规日志归档缺少最近一个 UTC 日"
              description: "最新已验证归档未覆盖上一个完整 UTC 日。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 16m
        alertname: ComplianceLogArchiveChainIncomplete
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "合规日志归档哈希链或只追加网关未通过验证"
              description: "在清单链和网关校验恢复前，不要将远程合规归档视为完整。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

  - name: disabled archive emits configuration alert but not freshness alerts
    interval: 1m
    input_series:
      - series: 'compliance_log_archive_configured{instance="losangeles",job="node-exporter"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 16m
        alertname: ComplianceLogArchiveNotConfigured
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "合规日志归档尚未配置"
              description: "受管归档 cron、凭据或启用开关缺失；恢复部署前，无法信任归档时效告警。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 31m
        alertname: ComplianceLogArchiveStale
        exp_alerts: []
      - eval_time: 31m
        alertname: ComplianceLogArchiveDayGap
        exp_alerts: []
      - eval_time: 16m
        alertname: ComplianceLogArchiveChainIncomplete
        exp_alerts: []

  - name: complete fresh archive metrics remain healthy
    interval: 1m
    input_series:
      - series: 'compliance_log_archive_configured{instance="losangeles",job="node-exporter"}'
        values: '1+0x60'
      - series: 'compliance_log_archive_last_success_timestamp{instance="losangeles",job="node-exporter"}'
        values: '0+0x60'
      - series: 'compliance_log_archive_day_timestamp{instance="losangeles",job="node-exporter"}'
        values: '0+0x60'
      - series: 'compliance_log_archive_chain_manifests{instance="losangeles",job="node-exporter"}'
        values: '2+0x60'
      - series: 'compliance_log_archive_append_only_gateway{instance="losangeles",job="node-exporter"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 31m
        alertname: ComplianceLogArchiveStale
        exp_alerts: []
      - eval_time: 31m
        alertname: ComplianceLogArchiveDayGap
        exp_alerts: []
      - eval_time: 16m
        alertname: ComplianceLogArchiveChainIncomplete
        exp_alerts: []
