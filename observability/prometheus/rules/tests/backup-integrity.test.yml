rule_files:
  - ../backup-integrity.yml

evaluation_interval: 1m

tests:
  - name: missing archive activation gate is critical
    interval: 1m
    alert_rule_test:
      - eval_time: 16m
        alertname: ComplianceLogArchiveNotConfigured
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Compliance log archive is not configured"
              description: "The managed archive cron, credentials, or activation gate is missing; archive freshness alerts cannot be trusted until deployment is restored."
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

  - name: configured archive reports missing verification metrics
    interval: 1m
    input_series:
      - series: 'compliance_log_archive_configured{instance="losangeles",job="node-exporter"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 31m
        alertname: ComplianceLogArchiveStale
        exp_alerts:
          - exp_labels:
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              summary: "Immutable compliance log archive verification is stale"
              description: "The daily audit/auth/Nginx archive has not completed its independent remote read-back within 36 hours."
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 31m
        alertname: ComplianceLogArchiveDayGap
        exp_alerts:
          - exp_labels:
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              summary: "Compliance log archive is missing a recent UTC day"
              description: "The newest verified archive does not cover the previous complete UTC day."
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 16m
        alertname: ComplianceLogArchiveChainIncomplete
        exp_alerts:
          - exp_labels:
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              summary: "Compliance log archive hash chain or append-only gateway is not verified"
              description: "Do not treat the remote compliance archive as complete until the manifest chain and gateway verification recover."
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

  - name: disabled archive emits configuration alert but not freshness alerts
    interval: 1m
    input_series:
      - series: 'compliance_log_archive_configured{instance="losangeles",job="node-exporter"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 16m
        alertname: ComplianceLogArchiveNotConfigured
        exp_alerts:
          - exp_labels:
              instance: losangeles
              job: node-exporter
              severity: critical
            exp_annotations:
              summary: "Compliance log archive is not configured"
              description: "The managed archive cron, credentials, or activation gate is missing; archive freshness alerts cannot be trusted until deployment is restored."
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 31m
        alertname: ComplianceLogArchiveStale
        exp_alerts: []
      - eval_time: 31m
        alertname: ComplianceLogArchiveDayGap
        exp_alerts: []
      - eval_time: 16m
        alertname: ComplianceLogArchiveChainIncomplete
        exp_alerts: []

  - name: complete fresh archive metrics remain healthy
    interval: 1m
    input_series:
      - series: 'compliance_log_archive_configured{instance="losangeles",job="node-exporter"}'
        values: '1+0x60'
      - series: 'compliance_log_archive_last_success_timestamp{instance="losangeles",job="node-exporter"}'
        values: '0+0x60'
      - series: 'compliance_log_archive_day_timestamp{instance="losangeles",job="node-exporter"}'
        values: '0+0x60'
      - series: 'compliance_log_archive_chain_manifests{instance="losangeles",job="node-exporter"}'
        values: '2+0x60'
      - series: 'compliance_log_archive_append_only_gateway{instance="losangeles",job="node-exporter"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 31m
        alertname: ComplianceLogArchiveStale
        exp_alerts: []
      - eval_time: 31m
        alertname: ComplianceLogArchiveDayGap
        exp_alerts: []
      - eval_time: 16m
        alertname: ComplianceLogArchiveChainIncomplete
        exp_alerts: []
