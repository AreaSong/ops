rule_files:
  - ../observability-stack.yml

evaluation_interval: 1m

tests:
  - name: component metrics targets down
    interval: 1m
    input_series:
      - series: 'up{job="grafana",instance="LosAngeles",service="grafana"}'
        values: '0+0x5'
      - series: 'up{job="alertmanager",instance="LosAngeles",service="alertmanager"}'
        values: '0+0x5'
      - series: 'up{job="blackbox_exporter",instance="LosAngeles",service="blackbox-exporter"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: GrafanaMetricsTargetDown
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: grafana
              service: grafana
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Grafana 指标端点不可用"
              description: "Grafana 就绪状态和指标是分别监控的；此告警表示 Prometheus 无法抓取 Grafana 指标。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 3m
        alertname: AlertmanagerMetricsTargetDown
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: alertmanager
              service: alertmanager
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Alertmanager 指标端点不可用"
              description: "Prometheus 无法抓取 Alertmanager；活动告警仍会显示在 Prometheus 中，但通知可能无法送达。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 3m
        alertname: BlackboxExporterMetricsTargetDown
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: blackbox_exporter
              service: blackbox-exporter
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Blackbox Exporter 指标端点不可用"
              description: "共享 Exporter 不可用时，合成探测告警可能批量出现；请先调查此根因告警。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: grafana datasource repeated failures
    interval: 1m
    input_series:
      - series: 'grafana_datasource_request_total{job="grafana",instance="LosAngeles",service="grafana",datasource="Prometheus",datasource_type="prometheus",method="post",code="503"}'
        values: '0 0 0 0 0 6 12 18'
    alert_rule_test:
      - eval_time: 4m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts: []
      - eval_time: 5m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts: []
      - eval_time: 6m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts: []
      - eval_time: 7m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts:
          - exp_labels:
              datasource: Prometheus
              datasource_type: prometheus
              instance: LosAngeles
              owner: areasong-ops
              service: grafana
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Grafana 数据源 Prometheus 重复返回 5xx"
              description: "Grafana 在五分钟内记录到 Prometheus（prometheus）超过五次 5xx 响应；请检查该数据源及其上游查询服务。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: component reload and notification failures
    interval: 1m
    input_series:
      - series: 'alertmanager_config_last_reload_successful{job="alertmanager",instance="LosAngeles",service="alertmanager"}'
        values: '0+0x15'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="LosAngeles",service="alertmanager",integration="email",reason="serverError"}'
        values: '0+0x5 1+0x10'
      - series: 'blackbox_exporter_config_last_reload_successful{job="blackbox_exporter",instance="LosAngeles",service="blackbox-exporter"}'
        values: '0+0x15'
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="LosAngeles",service="prometheus"}'
        values: '0+0x15'
      - series: 'prometheus_tsdb_wal_corruptions_total{job="prometheus",instance="LosAngeles",service="prometheus"}'
        values: '0+0x5 1+0x10'
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="LosAngeles",service="prometheus",rule_group="test"}'
        values: '0+0x5 1+0x10'
      - series: 'prometheus_notifications_dropped_total{job="prometheus",instance="LosAngeles",service="prometheus"}'
        values: '0+0x5 1+0x10'
      - series: 'node_textfile_scrape_error{job="node",instance="LosAngeles",service="node-exporter"}'
        values: '1+0x15'
      - series: 'promtail_dropped_entries_total{job="promtail",instance="LosAngeles",service="promtail",reason="rate_limited"}'
        values: '0+0x5 1+0x10'
      - series: 'loki_ingester_wal_discarded_samples_total{job="loki",instance="LosAngeles",service="loki",reason="corruption"}'
        values: '0+0x5 1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: AlertmanagerConfigReloadFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: alertmanager
              service: alertmanager
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Alertmanager 拒绝了最新配置重载"
              description: "Alertmanager 仍使用上一份配置运行；请先校验并重载目标配置，再依赖路由变更。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: AlertmanagerNotificationFailures
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              integration: email
              service: alertmanager
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Alertmanager 通知投递失败：email"
              description: "最近十分钟内至少有一条通知失败；请验证接收器和独立的 GitHub 看门狗链路。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: BlackboxExporterConfigReloadFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: blackbox_exporter
              service: blackbox-exporter
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Blackbox Exporter 拒绝了最新配置重载"
              description: "Blackbox Exporter 仍使用上一份配置运行；重试重载前请校验模块。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: prometheus
              service: prometheus
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus 拒绝了最新配置重载"
              description: "Prometheus 仍使用上一份配置运行；再次重载前请校验规则和抓取配置。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusWalCorruptionDetected
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: prometheus
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus 检测到 WAL 损坏"
              description: "Prometheus 在最近十五分钟报告了新的预写日志损坏；请保留证据并检查 TSDB 恢复日志。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: prometheus
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus 规则评估失败"
              description: "最近十分钟内至少有一条记录或告警规则评估失败；信任派生信号前请检查失败的规则组。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusNotificationsDropped
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: prometheus
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus 丢弃了告警通知"
              description: "最近十分钟内 Prometheus 至少丢弃了一条发往 Alertmanager 的通知；请检查队列容量和 Alertmanager 连通性。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: NodeTextfileScrapeError
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: node
              service: node-exporter
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Node Exporter 无法读取一个或多个 textfile 指标"
              description: "格式错误或不可读的 textfile collector 文件已导致主机任务指标至少五分钟不可见；请检查采集器日志和最近的指标文件。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PromtailLogEntriesDropped
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: promtail
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Promtail 丢弃了日志条目"
              description: "最近十分钟内 Promtail 丢弃了一条或多条日志；请检查拒绝原因、客户端重试和 Loki 限制。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: LokiWalSamplesDiscarded
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki 丢弃了 WAL 样本"
              description: "Loki 在最近十五分钟回放或写入 WAL 时丢弃了一条或多条样本；请检查 ingester 日志和存储健康状态。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: loki compactor and retention failures
    interval: 1m
    input_series:
      - series: 'up{job="loki",instance="LosAngeles",service="loki"}'
        values: '1+0x200'
      - series: 'process_start_time_seconds{job="loki",instance="LosAngeles",service="loki"}'
        values: '0+0x200'
      - series: 'loki_boltdb_shipper_compactor_running{job="loki",instance="LosAngeles",service="loki"}'
        values: '0+0x200'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_current{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '46+0x200'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_deleted_total{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '0+0x200'
    alert_rule_test:
      - eval_time: 16m
        alertname: LokiCompactorNotRunning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: loki
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki compactor 未运行"
              description: "compactor 超过启动稳定窗口仍未活动；保留清理和索引压缩可能已停滞。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 91m
        alertname: LokiRetentionApplyStalled
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: loki
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki 保留清理未成功完成"
              description: "Loki 正常运行，但保留清理未能在预期压缩周期和启动宽限时间内完成。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 181m
        alertname: LokiRetentionMarkerProcessingStalled
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki 保留清理标记队列未减少"
              description: "删除标记超过配置的两小时删除延迟后仍在排队，且没有成功删除记录。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: healthy loki retention remains quiet
    interval: 1m
    input_series:
      - series: 'up{job="loki",instance="LosAngeles",service="loki"}'
        values: '1+0x70'
      - series: 'process_start_time_seconds{job="loki",instance="LosAngeles",service="loki"}'
        values: '0+0x70'
      - series: 'loki_boltdb_shipper_compactor_running{job="loki",instance="LosAngeles",service="loki"}'
        values: '1+0x70'
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="loki",instance="LosAngeles",service="loki"}'
        values: '3000+60x70'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_current{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '0+0x70'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_deleted_total{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 60m
        alertname: LokiCompactorNotRunning
        exp_alerts: []
      - eval_time: 60m
        alertname: LokiRetentionApplyStalled
        exp_alerts: []
      - eval_time: 60m
        alertname: LokiRetentionMarkerProcessingStalled
        exp_alerts: []
