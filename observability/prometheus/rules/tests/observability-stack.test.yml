rule_files:
  - ../observability-stack.yml

evaluation_interval: 1m

tests:
  - name: component metrics targets down
    interval: 1m
    input_series:
      - series: 'up{job="grafana",instance="LosAngeles",service="grafana"}'
        values: '0+0x5'
      - series: 'up{job="alertmanager",instance="LosAngeles",service="alertmanager"}'
        values: '0+0x5'
      - series: 'up{job="blackbox_exporter",instance="LosAngeles",service="blackbox-exporter"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: GrafanaMetricsTargetDown
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: grafana
              service: grafana
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Grafana metrics endpoint is unavailable"
              description: "Grafana readiness and metrics are monitored separately; this alert means Prometheus cannot scrape Grafana metrics."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 3m
        alertname: AlertmanagerMetricsTargetDown
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: alertmanager
              service: alertmanager
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Alertmanager metrics endpoint is unavailable"
              description: "Prometheus cannot scrape Alertmanager; active alerts remain visible in Prometheus but notifications may not be delivered."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 3m
        alertname: BlackboxExporterMetricsTargetDown
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: blackbox_exporter
              service: blackbox-exporter
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Blackbox Exporter metrics endpoint is unavailable"
              description: "Synthetic probe alerts may fan out while their shared exporter is unavailable; investigate this root-cause alert first."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: grafana datasource repeated failures
    interval: 1m
    input_series:
      - series: 'grafana_datasource_request_total{job="grafana",instance="LosAngeles",service="grafana",datasource="Prometheus",datasource_type="prometheus",method="post",code="503"}'
        values: '0 0 0 0 0 6 12 18'
    alert_rule_test:
      - eval_time: 4m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts: []
      - eval_time: 5m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts: []
      - eval_time: 6m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts: []
      - eval_time: 7m
        alertname: GrafanaDatasourceRequestErrors
        exp_alerts:
          - exp_labels:
              datasource: Prometheus
              datasource_type: prometheus
              instance: LosAngeles
              owner: areasong-ops
              service: grafana
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Grafana datasource Prometheus is returning repeated 5xx responses"
              description: "Grafana recorded more than five 5xx responses in five minutes for Prometheus (prometheus); inspect that datasource and its upstream query service."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: component reload and notification failures
    interval: 1m
    input_series:
      - series: 'alertmanager_config_last_reload_successful{job="alertmanager",instance="LosAngeles",service="alertmanager"}'
        values: '0+0x15'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="LosAngeles",service="alertmanager",integration="email",reason="serverError"}'
        values: '0+0x5 1+0x10'
      - series: 'blackbox_exporter_config_last_reload_successful{job="blackbox_exporter",instance="LosAngeles",service="blackbox-exporter"}'
        values: '0+0x15'
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="LosAngeles",service="prometheus"}'
        values: '0+0x15'
      - series: 'prometheus_tsdb_wal_corruptions_total{job="prometheus",instance="LosAngeles",service="prometheus"}'
        values: '0+0x5 1+0x10'
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="LosAngeles",service="prometheus",rule_group="test"}'
        values: '0+0x5 1+0x10'
      - series: 'prometheus_notifications_dropped_total{job="prometheus",instance="LosAngeles",service="prometheus"}'
        values: '0+0x5 1+0x10'
      - series: 'node_textfile_scrape_error{job="node",instance="LosAngeles",service="node-exporter"}'
        values: '1+0x15'
      - series: 'promtail_dropped_entries_total{job="promtail",instance="LosAngeles",service="promtail",reason="rate_limited"}'
        values: '0+0x5 1+0x10'
      - series: 'loki_ingester_wal_discarded_samples_total{job="loki",instance="LosAngeles",service="loki",reason="corruption"}'
        values: '0+0x5 1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: AlertmanagerConfigReloadFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: alertmanager
              service: alertmanager
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Alertmanager rejected its latest configuration reload"
              description: "Alertmanager is still running with its previous configuration; validate and reload the intended configuration before relying on routing changes."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: AlertmanagerNotificationFailures
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              integration: email
              service: alertmanager
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Alertmanager notification delivery failed: email"
              description: "At least one notification failed in the last ten minutes; verify the receiver and the independent GitHub watchdog path."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: BlackboxExporterConfigReloadFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: blackbox_exporter
              service: blackbox-exporter
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Blackbox Exporter rejected its latest configuration reload"
              description: "Blackbox Exporter is still running with its previous configuration; validate modules before retrying the reload."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: prometheus
              service: prometheus
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus rejected its latest configuration reload"
              description: "Prometheus is still running with its previous configuration; validate rules and scrape configuration before reloading again."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusWalCorruptionDetected
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: prometheus
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus detected WAL corruption"
              description: "Prometheus reported a new write-ahead log corruption in the last fifteen minutes; preserve evidence and inspect TSDB recovery logs."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: prometheus
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus rule evaluation failed"
              description: "At least one recording or alerting rule evaluation failed in the last ten minutes; inspect the failing rule group before trusting derived signals."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PrometheusNotificationsDropped
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: prometheus
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Prometheus dropped alert notifications"
              description: "Prometheus dropped at least one notification bound for Alertmanager in the last ten minutes; inspect queue capacity and Alertmanager connectivity."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: NodeTextfileScrapeError
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: node
              service: node-exporter
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Node Exporter cannot read one or more textfile metrics"
              description: "A malformed or unreadable textfile collector file has hidden host-job metrics for at least five minutes; inspect collector logs and recent metric files."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: PromtailLogEntriesDropped
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: promtail
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Promtail dropped log entries"
              description: "Promtail discarded one or more log entries in the last ten minutes; inspect rejection reasons, client retries, and Loki limits."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 6m
        alertname: LokiWalSamplesDiscarded
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki discarded WAL samples"
              description: "Loki discarded one or more samples while replaying or writing its WAL in the last fifteen minutes; inspect ingester logs and storage health."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: loki compactor and retention failures
    interval: 1m
    input_series:
      - series: 'up{job="loki",instance="LosAngeles",service="loki"}'
        values: '1+0x200'
      - series: 'process_start_time_seconds{job="loki",instance="LosAngeles",service="loki"}'
        values: '0+0x200'
      - series: 'loki_boltdb_shipper_compactor_running{job="loki",instance="LosAngeles",service="loki"}'
        values: '0+0x200'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_current{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '46+0x200'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_deleted_total{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '0+0x200'
    alert_rule_test:
      - eval_time: 16m
        alertname: LokiCompactorNotRunning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: loki
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki compactor is not active"
              description: "The compactor has remained inactive beyond its startup stabilization window; retention and index compaction may be stalled."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 91m
        alertname: LokiRetentionApplyStalled
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              instance: LosAngeles
              job: loki
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki retention has not completed successfully"
              description: "Loki is up, but retention has not completed within the expected compaction interval and startup allowance."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 181m
        alertname: LokiRetentionMarkerProcessingStalled
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              service: loki
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Loki retention marker queue is not draining"
              description: "Deletion markers remained queued beyond the configured two-hour delete delay without any successful deletion."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: healthy loki retention remains quiet
    interval: 1m
    input_series:
      - series: 'up{job="loki",instance="LosAngeles",service="loki"}'
        values: '1+0x70'
      - series: 'process_start_time_seconds{job="loki",instance="LosAngeles",service="loki"}'
        values: '0+0x70'
      - series: 'loki_boltdb_shipper_compactor_running{job="loki",instance="LosAngeles",service="loki"}'
        values: '1+0x70'
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="loki",instance="LosAngeles",service="loki"}'
        values: '3000+60x70'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_current{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '0+0x70'
      - series: 'loki_boltdb_shipper_retention_sweeper_marker_files_deleted_total{job="loki",instance="LosAngeles",service="loki",from="filesystem_2024-01-01"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 60m
        alertname: LokiCompactorNotRunning
        exp_alerts: []
      - eval_time: 60m
        alertname: LokiRetentionApplyStalled
        exp_alerts: []
      - eval_time: 60m
        alertname: LokiRetentionMarkerProcessingStalled
        exp_alerts: []
