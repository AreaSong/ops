rule_files:
  - ../log-pipeline.yml

evaluation_interval: 1m

tests:
  - name: future audit probe timestamp is rejected
    interval: 1m
    input_series:
      - series: audit_log_pipeline_last_event_timestamp_seconds
        values: '3600+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: AuditLogPipelineStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "auditd 到 Loki 管道已过期"
              description: "Loki 中未发现近期固定审计管道探针。请检查 auditd、文件权限、Promtail positions 和 Loki 摄入。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: continuously fresh audit probe timestamp remains healthy
    interval: 1m
    input_series:
      - series: audit_log_pipeline_last_event_timestamp_seconds
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: AuditLogPipelineStale
        exp_alerts: []

  - name: failed end to end probe raises an alert
    interval: 1m
    input_series:
      - series: audit_log_pipeline_check_success
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: AuditLogPipelineCheckFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "auditd 事件未到达 Loki"
              description: "固定的无敏感信息审计探针无法在五分钟内完成写入、查询或观测。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
