rule_files:
  - ../slo.yml

evaluation_interval: 15s

tests:
  - name: two hour fixture reports proportional coverage
    interval: 15s
    input_series:
      - series: 'probe_success{scope="business",service="sub2api",journey="health",check="health-json"}'
        values: '1+0x480'
    promql_expr_test:
      - expr: 'service:synthetic_availability:ratio_30d{service="sub2api",journey="health"}'
        eval_time: 2h
        exp_samples:
          - labels: 'service:synthetic_availability:ratio_30d{service="sub2api",journey="health",slo="synthetic_availability",objective="0.999"}'
            value: 1
      - expr: 'service:synthetic_slo_coverage:ratio_30d{service="sub2api",journey="health"}'
        eval_time: 2h
        exp_samples:
          - labels: 'service:synthetic_slo_coverage:ratio_30d{service="sub2api",journey="health",slo="synthetic_availability",objective="0.999"}'
            value: 0.0027835648148148147
      - expr: 'service:synthetic_error_budget_remaining:ratio_30d{service="sub2api",journey="health"}'
        eval_time: 2h
        exp_samples:
          - labels: 'service:synthetic_error_budget_remaining:ratio_30d{service="sub2api",journey="health",slo="synthetic_availability",objective="0.999"}'
            value: 1

  - name: missing raw samples reduce proportional coverage
    interval: 15s
    input_series:
      - series: 'probe_success{scope="business",service="resume-jadeai",journey="public-home",check="resume-home"}'
        values: '1+0x239 stale _x240'
    promql_expr_test:
      - expr: 'service:synthetic_availability:ratio_30d{service="resume-jadeai",journey="public-home"}'
        eval_time: 2h
        exp_samples:
          - labels: 'service:synthetic_availability:ratio_30d{service="resume-jadeai",journey="public-home",slo="synthetic_availability",objective="0.999"}'
            value: 1
      - expr: 'service:synthetic_slo_coverage:ratio_30d{service="resume-jadeai",journey="public-home"}'
        eval_time: 2h
        exp_samples:
          - labels: 'service:synthetic_slo_coverage:ratio_30d{service="resume-jadeai",journey="public-home",slo="synthetic_availability",objective="0.999"}'
            value: 0.001388888888888889

  - name: one failed minute exhausts the scaled 99.9 percent budget
    interval: 15s
    input_series:
      - series: 'probe_success{scope="business",service="account-vault",journey="login",check="login-page"}'
        values: '1+0x478 0 stale'
    promql_expr_test:
      - expr: 'service:synthetic_availability:ratio_30d{service="account-vault",journey="login"}'
        eval_time: 2h
        exp_samples:
          - labels: 'service:synthetic_availability:ratio_30d{service="account-vault",journey="login",slo="synthetic_availability",objective="0.999"}'
            value: 0.9979166666666667
      - expr: 'service:synthetic_error_budget_remaining:ratio_30d{service="account-vault",journey="login"}'
        eval_time: 2h
        exp_samples:
          - labels: 'service:synthetic_error_budget_remaining:ratio_30d{service="account-vault",journey="login",slo="synthetic_availability",objective="0.999"}'
            value: 0
