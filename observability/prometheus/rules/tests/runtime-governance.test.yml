rule_files:
  - /rules/alerts.yml

evaluation_interval: 15s

tests:
  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 2h
        alertname: DockerBuildCachePruneStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: host
              service: docker
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Docker BuildKit 缓存清理已过期"
              description: "每周清理已连续八天未发布成功结果；请检查 cron、锁和清理日志。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-14d&to=now"

  - interval: 1m
    input_series:
      - series: 'docker_storage_reclaimable_bytes{type="build_cache"}'
        values: '11811160064+0x500'
    alert_rule_test:
      - eval_time: 7h
        alertname: DockerBuildCacheExcessive
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: host
              service: docker
              type: build_cache
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Docker BuildKit 可回收缓存超过 10 GiB"
              description: "清理宽限期结束后，未使用的构建缓存仍高于主机预算。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-14d&to=now"

  - interval: 1m
    input_series:
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="2xx"}'
        values: '89+0x2'
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="3xx"}'
        values: '1+0x2'
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="4xx"}'
        values: '8+0x2'
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="5xx"}'
        values: '2+0x2'
      - series: 'business_http_4xx_last_5m{service="sub2api"}'
        values: '8+0x2'
      - series: 'business_http_5xx_last_5m{service="sub2api"}'
        values: '2+0x2'
      - series: 'business_http_slow_requests_last_5m{service="sub2api",threshold="2s"}'
        values: '5+0x2'
    promql_expr_test:
      - expr: 'service:business_http_requests:sum_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_requests:sum_5m{service="sub2api"}'
            value: 100
      - expr: 'service:business_http_4xx:ratio_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_4xx:ratio_5m{service="sub2api"}'
            value: 0.08
      - expr: 'service:business_http_5xx:ratio_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_5xx:ratio_5m{service="sub2api"}'
            value: 0.02
      - expr: 'service:business_http_slow:ratio_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_slow:ratio_5m{service="sub2api"}'
            value: 0.05

  - interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: AccountVaultReleaseMetricsMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: deployment
              service: account-vault
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Account Vault 发布证据指标缺失"
              description: "请部署受控发布脚本，并验证 node-exporter textfile collector 能读取 account-vault-release.prom。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-runtime?orgId=1&from=now-6h&to=now"

  - interval: 15s
    input_series:
      - series: business_error_log_events_last_run
        values: 25 0
    alert_rule_test:
      - eval_time: 0s
        alertname: BusinessErrorEventsBurst
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "业务警告/错误事件急剧增加"
              description: "一次采集运行中记录到超过二十条已脱敏的警告/错误事件。"
              loki_query: '{job="business_errors", host="LosAngeles"}'
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-runtime?orgId=1&from=now-6h&to=now"
      - eval_time: 15s
        alertname: BusinessErrorEventsBurst
        exp_alerts: []

  # xray 流量审计：指标从未出现（absent 分支）应在 for 10m 后告警
  - interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 12m
        alertname: XrayTrafficMetricsStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: business
              service: x-ui
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "xray 流量审计指标已过期"
              description: "xray 出站流量采集器在最近五分钟内未成功完成。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

  # xray 流量审计：时间戳停在 0（落后超过 300s）应告警；紧跟 time() 的新鲜时间戳不告警
  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_last_run_timestamp
        values: '0+0x100'
    alert_rule_test:
      - eval_time: 16m
        alertname: XrayTrafficMetricsStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: business
              service: x-ui
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "xray 流量审计指标已过期"
              description: "xray 出站流量采集器在最近五分钟内未成功完成。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_last_run_timestamp
        values: '0+15x100'
    alert_rule_test:
      - eval_time: 20m
        alertname: XrayTrafficMetricsStale
        exp_alerts: []

  # xray statsquery API 连续失败 10m 应告警；成功时不告警
  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_check_success
        values: '0+0x100'
    alert_rule_test:
      - eval_time: 12m
        alertname: XrayTrafficStatsQueryFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: business
              service: x-ui
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "xray statsquery API 失败"
              description: "采集器无法从 127.0.0.1:62789 的 xray API 读取出站流量计数器。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_check_success
        values: '1+0x100'
    alert_rule_test:
      - eval_time: 12m
        alertname: XrayTrafficStatsQueryFailed
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'account_vault_release_last_success{action="deploy"}'
        values: 0 1
    alert_rule_test:
      - eval_time: 0s
        alertname: AccountVaultReleaseFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              action: deploy
              severity: critical
              scope: deployment
              service: account-vault
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "最新 Account Vault 发布操作失败"
              description: "重试前请检查发布日志、保留的 Compose 快照、当前/上一镜像状态和服务健康状况。"
              grafana_url: https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now
      - eval_time: 15s
        alertname: AccountVaultReleaseFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: alertmanager_github_issue_sync_configured
        values: '1+0x30'
      - series: alertmanager_github_token_expiry_configured
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiryMetadataMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: alerting
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "GitHub Issue 同步令牌到期元数据缺失"
              description: "请在仅 root 可读的配置中设置 GITHUB_TOKEN_EXPIRES_AT，以便在通知覆盖失效前安排令牌轮换。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - interval: 1m
    input_series:
      - series: alertmanager_github_token_expiry_configured
        values: '1+0x30'
      - series: alertmanager_github_token_days_until_expiry
        values: '10+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringWarning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: alerting
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "GitHub Issue 同步令牌将在 14 天内到期"
              description: "请在进入七天严重窗口前轮换细粒度 GitHub 令牌，并更新仅 root 可读的配置。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: alertmanager_github_token_expiry_configured
        values: '1+0x30'
      - series: alertmanager_github_token_days_until_expiry
        values: '6+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringWarning
        exp_alerts: []
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringCritical
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
              scope: alerting
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "GitHub Issue 同步令牌将在 7 天内到期"
              description: "请立即轮换并验证细粒度 GitHub 令牌；令牌到期将导致独立严重告警链路失效。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
