rule_files:
  - /rules/alerts.yml

evaluation_interval: 15s

tests:
  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 2h
        alertname: DockerBuildCachePruneStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: host
              service: docker
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Docker BuildKit cache cleanup is stale"
              description: "The weekly cleanup has not published a successful result in eight days; verify cron, locking, and the cleanup log."
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-14d&to=now"

  - interval: 1m
    input_series:
      - series: 'docker_storage_reclaimable_bytes{type="build_cache"}'
        values: '11811160064+0x500'
    alert_rule_test:
      - eval_time: 7h
        alertname: DockerBuildCacheExcessive
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: host
              service: docker
              type: build_cache
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "Docker BuildKit reclaimable cache exceeds 10 GiB"
              description: "Unused build cache remains above the host budget after the cleanup grace period."
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-14d&to=now"

  - interval: 1m
    input_series:
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="2xx"}'
        values: '89+0x2'
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="3xx"}'
        values: '1+0x2'
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="4xx"}'
        values: '8+0x2'
      - series: 'business_http_requests_last_5m{service="sub2api",status_class="5xx"}'
        values: '2+0x2'
      - series: 'business_http_4xx_last_5m{service="sub2api"}'
        values: '8+0x2'
      - series: 'business_http_5xx_last_5m{service="sub2api"}'
        values: '2+0x2'
      - series: 'business_http_slow_requests_last_5m{service="sub2api",threshold="2s"}'
        values: '5+0x2'
    promql_expr_test:
      - expr: 'service:business_http_requests:sum_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_requests:sum_5m{service="sub2api"}'
            value: 100
      - expr: 'service:business_http_4xx:ratio_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_4xx:ratio_5m{service="sub2api"}'
            value: 0.08
      - expr: 'service:business_http_5xx:ratio_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_5xx:ratio_5m{service="sub2api"}'
            value: 0.02
      - expr: 'service:business_http_slow:ratio_5m{service="sub2api"}'
        eval_time: 1m
        exp_samples:
          - labels: 'service:business_http_slow:ratio_5m{service="sub2api"}'
            value: 0.05

  - interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: AccountVaultReleaseMetricsMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: deployment
              service: account-vault
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: Account Vault release evidence metric is missing
              description: Deploy the controlled release script and verify that the node-exporter textfile collector reads account-vault-release.prom.
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-runtime?orgId=1&from=now-6h&to=now"

  - interval: 15s
    input_series:
      - series: business_error_log_events_last_run
        values: 25 0
    alert_rule_test:
      - eval_time: 0s
        alertname: BusinessErrorEventsBurst
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: Business warning/error events increased sharply
              description: More than twenty sanitized warning/error events were recorded in one collector run.
              loki_query: '{job="business_errors", host="LosAngeles"}'
              grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-runtime?orgId=1&from=now-6h&to=now"
      - eval_time: 15s
        alertname: BusinessErrorEventsBurst
        exp_alerts: []

  # xray 流量审计：指标从未出现（absent 分支）应在 for 10m 后告警
  - interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 12m
        alertname: XrayTrafficMetricsStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: business
              service: x-ui
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "xray traffic audit metrics are stale"
              description: "The xray outbound traffic collector has not completed successfully in the last five minutes."
              grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

  # xray 流量审计：时间戳停在 0（落后超过 300s）应告警；紧跟 time() 的新鲜时间戳不告警
  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_last_run_timestamp
        values: '0+0x100'
    alert_rule_test:
      - eval_time: 16m
        alertname: XrayTrafficMetricsStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: business
              service: x-ui
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "xray traffic audit metrics are stale"
              description: "The xray outbound traffic collector has not completed successfully in the last five minutes."
              grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_last_run_timestamp
        values: '0+15x100'
    alert_rule_test:
      - eval_time: 20m
        alertname: XrayTrafficMetricsStale
        exp_alerts: []

  # xray statsquery API 连续失败 10m 应告警；成功时不告警
  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_check_success
        values: '0+0x100'
    alert_rule_test:
      - eval_time: 12m
        alertname: XrayTrafficStatsQueryFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: business
              service: x-ui
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "xray statsquery API is failing"
              description: "The collector cannot read outbound traffic counters from the xray API on 127.0.0.1:62789."
              grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

  - interval: 15s
    input_series:
      - series: xray_traffic_metrics_check_success
        values: '1+0x100'
    alert_rule_test:
      - eval_time: 12m
        alertname: XrayTrafficStatsQueryFailed
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'account_vault_release_last_success{action="deploy"}'
        values: 0 1
    alert_rule_test:
      - eval_time: 0s
        alertname: AccountVaultReleaseFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              action: deploy
              severity: critical
              scope: deployment
              service: account-vault
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: The latest Account Vault release action failed
              description: Inspect the release log, retained compose snapshot, current/previous image state, and service health before retrying.
              grafana_url: https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now
      - eval_time: 15s
        alertname: AccountVaultReleaseFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: alertmanager_github_issue_sync_configured
        values: '1+0x30'
      - series: alertmanager_github_token_expiry_configured
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiryMetadataMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: alerting
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "GitHub Issue sync token expiry metadata is missing"
              description: "Set GITHUB_TOKEN_EXPIRES_AT in the root-only configuration so token rotation is scheduled before notification coverage is lost."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - interval: 1m
    input_series:
      - series: alertmanager_github_token_expiry_configured
        values: '1+0x30'
      - series: alertmanager_github_token_days_until_expiry
        values: '10+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringWarning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
              scope: alerting
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "GitHub Issue sync token expires within fourteen days"
              description: "Rotate the fine-grained GitHub token and update the root-only configuration before the seven-day critical window."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: alertmanager_github_token_expiry_configured
        values: '1+0x30'
      - series: alertmanager_github_token_days_until_expiry
        values: '6+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringWarning
        exp_alerts: []
      - eval_time: 16m
        alertname: AlertmanagerGitHubTokenExpiringCritical
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
              scope: alerting
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "GitHub Issue sync token expires within seven days"
              description: "Rotate and validate the fine-grained GitHub token immediately; expiry will remove the independent critical-alert path."
              grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
