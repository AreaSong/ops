rule_files:
  - /rules/alerts.yml
  - /rules/backup-integrity.yml

evaluation_interval: 1m

tests:
  - name: missing backup pipeline metrics alert independently
    interval: 1m
    alert_rule_test:
      - eval_time: 11m
        alertname: BackupMetricsMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "备份时效指标缺失"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 11m
        alertname: BackupJobMetricsMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "备份执行指标缺失"
              description: "受控备份运行器尚未发布尝试次数、结果和耗时指标。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 11m
        alertname: R2BackupMetricsMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "R2 备份同步指标缺失"
              description: "异地 R2 备份同步尚未发布成功时间戳。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 11m
        alertname: BackupSetManifestMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "完整备份集清单缺失"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 11m
        alertname: R2BackupSetVerificationMissing
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "完整 R2 备份集校验缺失"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

  - name: twenty one hour backup age warns before RPO breach
    interval: 1h
    input_series:
      - series: 'backup_last_success_timestamp{backup="redis"}'
        values: '0+0x26'
      - series: r2_backup_last_success_timestamp
        values: '0+0x26'
      - series: backup_set_last_success_timestamp
        values: '0+0x26'
      - series: backup_set_r2_verify_last_success_timestamp
        values: '0+0x26'
      - series: 'backup_job_last_attempt_timestamp{backup_job="redis"}'
        values: '0+3600x26'
      - series: 'backup_job_last_result{backup_job="redis"}'
        values: '1+0x26'
    alert_rule_test:
      - eval_time: 21h
        alertname: BackupFreshnessWarning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              backup: redis
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "备份接近 RPO 限制：redis"
              description: "最新备份已超过 20 小时，距离突破 24 小时 RPO 剩余不足四小时。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 21h
        alertname: R2BackupFreshnessWarning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "R2 备份同步接近 RPO 限制"
              description: "最近一次成功的 R2 同步已超过 20 小时。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 21h
        alertname: BackupSetManifestFreshnessWarning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
            exp_annotations:
              description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "完整备份集接近 RPO 限制"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 21h
        alertname: R2BackupSetVerificationFreshnessWarning
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: warning
            exp_annotations:
              description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "完整 R2 备份校验接近 RPO 限制"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

  - name: twenty five hour backup age is critical without extra delay
    interval: 1h
    input_series:
      - series: 'backup_last_success_timestamp{backup="redis"}'
        values: '0+0x26'
      - series: r2_backup_last_success_timestamp
        values: '0+0x26'
      - series: backup_set_last_success_timestamp
        values: '0+0x26'
      - series: backup_set_r2_verify_last_success_timestamp
        values: '0+0x26'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              backup: redis
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "备份已过期：redis"
              description: "最新备份已突破 24 小时 RPO。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 25h
        alertname: R2BackupStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "R2 备份已过期"
              description: "异地 R2 备份同步已超过 24 小时 RPO 限制。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 25h
        alertname: BackupSetManifestStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "完整备份集已突破 24 小时 RPO"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 25h
        alertname: R2BackupSetVerificationStale
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              severity: critical
            exp_annotations:
              description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "完整 R2 备份校验已突破 24 小时 RPO"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
      - eval_time: 25h
        alertname: BackupFreshnessWarning
        exp_alerts: []

  - name: latest failed guarded job alerts after five minutes
    interval: 1m
    input_series:
      - series: 'backup_job_last_attempt_timestamp{backup_job="redis"}'
        values: '0+60x10'
      - series: 'backup_job_last_result{backup_job="redis"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: BackupJobFailed
        exp_alerts:
          - exp_labels:
              owner: areasong-ops
              backup_job: redis
              severity: warning
            exp_annotations:
              runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
              summary: "最新备份任务失败：redis"
              description: "请在下一个 RPO 时限前检查受控备份任务的结果和日志。"
              grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
