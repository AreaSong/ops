groups:
  - name: synthetic_slo_recording
    interval: 15s
    rules:
      - record: service:synthetic_journey_success:ratio
        expr: min by (service, journey) (probe_success{scope="business"})
        labels:
          slo: synthetic_availability
          objective: "0.999"

      - record: service:synthetic_burn_rate:ratio_5m
        expr: (1 - avg_over_time(service:synthetic_journey_success:ratio[5m])) / 0.001

      - record: service:synthetic_burn_rate:ratio_30m
        expr: (1 - avg_over_time(service:synthetic_journey_success:ratio[30m])) / 0.001

      - record: service:synthetic_burn_rate:ratio_1h
        expr: (1 - avg_over_time(service:synthetic_journey_success:ratio[1h])) / 0.001

      - record: service:synthetic_burn_rate:ratio_6h
        expr: (1 - avg_over_time(service:synthetic_journey_success:ratio[6h])) / 0.001

  - name: synthetic_slo_long_window_recording
    # 1m so instant queries (5m lookback) do not show intermittent No data
    interval: 1m
    rules:
      - record: service:synthetic_availability:ratio_30d
        expr: avg_over_time(service:synthetic_journey_success:ratio[30d])

      - record: service:synthetic_slo_coverage:ratio_30d
        expr: clamp_max(count_over_time(service:synthetic_journey_success:ratio[30d]) / 172800, 1)

      - record: service:synthetic_error_budget_remaining:ratio_30d
        expr: clamp(1 - ((1 - service:synthetic_availability:ratio_30d) / 0.001), 0, 1)

  - name: synthetic_slo_alerts
    interval: 1m
    rules:
      - alert: SyntheticSloFastBurnCritical
        expr: >-
          service:synthetic_burn_rate:ratio_5m > 14.4
          and on (service, journey, slo, objective)
          service:synthetic_burn_rate:ratio_1h > 14.4
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          scope: business
          window: fast
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "合成 SLO 错误预算快速消耗：{{ $labels.service }} / {{ $labels.journey }}"
          description: "99.9% 可用性错误预算在 5 分钟和 1 小时窗口中的消耗速度均超过 14.4 倍。"
          grafana_url: '{{ if eq $labels.service "sub2api" }}https://monitor.areasong.top/d/sub2api-slo-capacity/sub2api-slo-and-capacity?orgId=1&from=now-6h&to=now&var-journey={{ $labels.journey }}{{ else }}https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-6h&to=now{{ end }}'

      - alert: SyntheticSloSlowBurnWarning
        expr: >-
          service:synthetic_burn_rate:ratio_30m > 6
          and on (service, journey, slo, objective)
          service:synthetic_burn_rate:ratio_6h > 6
        for: 15m
        labels:
          owner: areasong-ops
          severity: warning
          scope: business
          window: slow
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "合成 SLO 错误预算持续消耗：{{ $labels.service }} / {{ $labels.journey }}"
          description: "99.9% 可用性错误预算在 30 分钟和 6 小时窗口中的消耗速度均超过 6 倍。"
          grafana_url: '{{ if eq $labels.service "sub2api" }}https://monitor.areasong.top/d/sub2api-slo-capacity/sub2api-slo-and-capacity?orgId=1&from=now-24h&to=now&var-journey={{ $labels.journey }}{{ else }}https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-24h&to=now{{ end }}'

      - alert: SyntheticSloBudgetLow
        expr: >-
          service:synthetic_error_budget_remaining:ratio_30d > 0
          and service:synthetic_error_budget_remaining:ratio_30d < 0.25
          and on (service, journey, slo, objective)
          service:synthetic_slo_coverage:ratio_30d >= 0.95
        for: 30m
        labels:
          owner: areasong-ops
          severity: warning
          scope: business
          window: 30d
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "合成 SLO 错误预算低于 25%：{{ $labels.service }} / {{ $labels.journey }}"
          description: "30 天观测窗口至少已覆盖 95%，且剩余错误预算不足四分之一。"
          grafana_url: '{{ if eq $labels.service "sub2api" }}https://monitor.areasong.top/d/sub2api-slo-capacity/sub2api-slo-and-capacity?orgId=1&from=now-30d&to=now&var-journey={{ $labels.journey }}{{ else }}https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-30d&to=now{{ end }}'

      - alert: SyntheticSloBudgetExhausted
        expr: >-
          service:synthetic_error_budget_remaining:ratio_30d == 0
          and on (service, journey, slo, objective)
          service:synthetic_slo_coverage:ratio_30d >= 0.95
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
          scope: business
          window: 30d
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "合成 SLO 错误预算耗尽：{{ $labels.service }} / {{ $labels.journey }}"
          description: "30 天观测窗口至少已覆盖 95%，且 99.9% 可用性错误预算已经耗尽。"
          grafana_url: '{{ if eq $labels.service "sub2api" }}https://monitor.areasong.top/d/sub2api-slo-capacity/sub2api-slo-and-capacity?orgId=1&from=now-30d&to=now&var-journey={{ $labels.journey }}{{ else }}https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-30d&to=now{{ end }}'
