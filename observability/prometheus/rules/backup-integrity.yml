groups:
  - name: backup_integrity_alerts
    rules:
      - alert: BackupSetManifestMissing
        expr: absent(backup_set_last_success_timestamp)
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "完整备份集清单缺失"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupSetManifestFreshnessWarning
        expr: time() - backup_set_last_success_timestamp > 20 * 3600 and time() - backup_set_last_success_timestamp <= 24 * 3600
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "完整备份集接近 RPO 限制"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupSetManifestStale
        expr: time() - backup_set_last_success_timestamp > 24 * 3600
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "完整备份集已突破 24 小时 RPO"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupSetManifestInvalid
        expr: backup_set_artifacts != 9 or backup_set_artifact_span_seconds > 3 * 3600
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "最新备份集不完整或时间跨度过大"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationMissing
        expr: absent(backup_set_r2_verify_last_success_timestamp)
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "完整 R2 备份集校验缺失"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationFreshnessWarning
        expr: time() - backup_set_r2_verify_last_success_timestamp > 20 * 3600 and time() - backup_set_r2_verify_last_success_timestamp <= 24 * 3600
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "完整 R2 备份校验接近 RPO 限制"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationStale
        expr: time() - backup_set_r2_verify_last_success_timestamp > 24 * 3600
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "完整 R2 备份校验已突破 24 小时 RPO"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationIncomplete
        expr: backup_set_r2_verify_artifacts != 9
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "最新 R2 备份集校验未覆盖所有必需产物"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: AreaForgeRestoreDrillStale
        expr: absent(areaforge_restore_drill_last_success_timestamp) or time() - areaforge_restore_drill_last_success_timestamp > 35 * 86400
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "AreaForge 隔离恢复演练缺失或已超过 35 天"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveNotConfigured
        expr: absent(compliance_log_archive_configured) or compliance_log_archive_configured != 1
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "合规日志归档尚未配置"
          description: "受管归档 cron、凭据或启用开关缺失；恢复部署前，无法信任归档时效告警。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveStale
        expr: compliance_log_archive_configured == 1 and on() (absent(compliance_log_archive_last_success_timestamp) or time() - compliance_log_archive_last_success_timestamp > 36 * 3600)
        for: 30m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "不可变合规日志归档校验已过期"
          description: "每日审计、认证和 Nginx 日志归档未能在 36 小时内完成独立远程回读。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveDayGap
        expr: compliance_log_archive_configured == 1 and on() (absent(compliance_log_archive_day_timestamp) or time() - compliance_log_archive_day_timestamp > 48 * 3600)
        for: 30m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "合规日志归档缺少最近一个 UTC 日"
          description: "最新已验证归档未覆盖上一个完整 UTC 日。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveChainIncomplete
        expr: compliance_log_archive_configured == 1 and on() (absent(compliance_log_archive_chain_manifests) or compliance_log_archive_chain_manifests < 1 or absent(compliance_log_archive_append_only_gateway) or compliance_log_archive_append_only_gateway != 1)
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "合规日志归档哈希链或只追加网关未通过验证"
          description: "在清单链和网关校验恢复前，不要将远程合规归档视为完整。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
