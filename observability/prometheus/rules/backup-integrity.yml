groups:
  - name: backup_integrity_alerts
    rules:
      - alert: BackupSetManifestMissing
        expr: absent(backup_set_last_success_timestamp)
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Complete backup set manifest is missing"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupSetManifestFreshnessWarning
        expr: time() - backup_set_last_success_timestamp > 20 * 3600 and time() - backup_set_last_success_timestamp <= 24 * 3600
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Complete backup set is approaching the RPO limit"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupSetManifestStale
        expr: time() - backup_set_last_success_timestamp > 24 * 3600
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Complete backup set has breached the 24-hour RPO"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupSetManifestInvalid
        expr: backup_set_artifacts != 9 or backup_set_artifact_span_seconds > 3 * 3600
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Latest backup set is incomplete or spans too much time"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationMissing
        expr: absent(backup_set_r2_verify_last_success_timestamp)
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Complete R2 backup set verification is missing"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationFreshnessWarning
        expr: time() - backup_set_r2_verify_last_success_timestamp > 20 * 3600 and time() - backup_set_r2_verify_last_success_timestamp <= 24 * 3600
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Complete R2 backup verification is approaching the RPO limit"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationStale
        expr: time() - backup_set_r2_verify_last_success_timestamp > 24 * 3600
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Complete R2 backup verification has breached the 24-hour RPO"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupSetVerificationIncomplete
        expr: backup_set_r2_verify_artifacts != 9
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Latest R2 backup set verification did not cover all required artifacts"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: AreaForgeRestoreDrillStale
        expr: absent(areaforge_restore_drill_last_success_timestamp) or time() - areaforge_restore_drill_last_success_timestamp > 35 * 86400
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "This alert remained active beyond its configured threshold; use the linked runbook to confirm impact, identify the root cause, and verify recovery."
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "AreaForge isolated restore drill is missing or older than 35 days"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveNotConfigured
        expr: absent(compliance_log_archive_configured) or compliance_log_archive_configured != 1
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Compliance log archive is not configured"
          description: "The managed archive cron, credentials, or activation gate is missing; archive freshness alerts cannot be trusted until deployment is restored."
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveStale
        expr: compliance_log_archive_configured == 1 and on() (absent(compliance_log_archive_last_success_timestamp) or time() - compliance_log_archive_last_success_timestamp > 36 * 3600)
        for: 30m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Immutable compliance log archive verification is stale"
          description: "The daily audit/auth/Nginx archive has not completed its independent remote read-back within 36 hours."
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveDayGap
        expr: compliance_log_archive_configured == 1 and on() (absent(compliance_log_archive_day_timestamp) or time() - compliance_log_archive_day_timestamp > 48 * 3600)
        for: 30m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Compliance log archive is missing a recent UTC day"
          description: "The newest verified archive does not cover the previous complete UTC day."
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: ComplianceLogArchiveChainIncomplete
        expr: compliance_log_archive_configured == 1 and on() (absent(compliance_log_archive_chain_manifests) or compliance_log_archive_chain_manifests < 1 or absent(compliance_log_archive_append_only_gateway) or compliance_log_archive_append_only_gateway != 1)
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Compliance log archive hash chain or append-only gateway is not verified"
          description: "Do not treat the remote compliance archive as complete until the manifest chain and gateway verification recover."
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"
