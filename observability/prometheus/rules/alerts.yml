          and on ()
          alertmanager_github_token_days_until_expiry < 7
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
          scope: alerting
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
