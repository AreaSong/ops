          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"


      - alert: CloudflareOriginCertCheckFailed
        expr: cloudflare_origin_cert_check_success == 0
        for: 15m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Cloudflare Origin 证书检查失败：{{ $labels.cert }}"
          description: "无法读取或解析本机 Cloudflare Origin 证书文件。请检查证书路径和权限。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring180Days
        expr: cloudflare_origin_cert_days_until_expiry < 180 and cloudflare_origin_cert_days_until_expiry >= 90
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Cloudflare Origin 证书将在 180 天内到期：{{ $labels.cert }}"
          description: "请开始规划续期。这是 Origin Certificate 轮换窗口的首次长期提醒。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring90Days
        expr: cloudflare_origin_cert_days_until_expiry < 90 and cloudflare_origin_cert_days_until_expiry >= 30
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Cloudflare Origin 证书将在 90 天内到期：{{ $labels.cert }}"
          description: "请准备新的 Origin Certificate，并安排低风险轮换窗口。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring30Days
        expr: cloudflare_origin_cert_days_until_expiry < 30 and cloudflare_origin_cert_days_until_expiry >= 7
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Cloudflare Origin 证书将在 30 天内到期：{{ $labels.cert }}"
          description: "请尽快轮换 Origin Certificate，并验证 Cloudflare Full (strict) 回源 TLS。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiringCritical
        expr: cloudflare_origin_cert_days_until_expiry < 7
        for: 30m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Cloudflare Origin 证书将在 7 天内到期：{{ $labels.cert }}"
          description: "请立即轮换 Origin Certificate，避免 Cloudflare Full (strict) 回源 TLS 失败。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

