groups:
  - name: node_alerts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "主机不可用：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-host-overview/losangeles-host-overview?orgId=1&from=now-6h&to=now"

      - alert: DiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 80
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "磁盘使用率偏高：{{ $labels.instance }} {{ $labels.mountpoint }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-host-overview/losangeles-host-overview?orgId=1&from=now-6h&to=now"

      - alert: DiskUsageCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 90
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "磁盘使用率严重：{{ $labels.instance }} {{ $labels.mountpoint }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-host-overview/losangeles-host-overview?orgId=1&from=now-6h&to=now"

      - alert: MemoryUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "内存使用率偏高：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-host-overview/losangeles-host-overview?orgId=1&from=now-6h&to=now"

      - alert: CpuUsageHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "CPU 使用率偏高：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-host-overview/losangeles-host-overview?orgId=1&from=now-6h&to=now"

  - name: blackbox_alerts
    rules:
      - alert: GrafanaInternalProbeFailed
        expr: probe_success{job="blackbox_grafana_internal"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: grafana
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Grafana 内部就绪探测失败"
          description: "本机 Grafana API 健康端点不可用，与 Cloudflare Access 无关。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: HttpProbeFailed
        expr: probe_success{job="blackbox_https"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "HTTPS 探测失败：{{ $labels.target }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-cloudflare?orgId=1&from=now-6h&to=now"

      - alert: SslCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_https"} - time() < 86400 * 30
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "TLS 证书将在 30 天内到期：{{ $labels.target }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: SslCertExpiringCritical
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_https"} - time() < 86400 * 7
        for: 30m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "TLS 证书将在 7 天内到期：{{ $labels.target }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-cloudflare?orgId=1&from=now-30d&to=now"

  - name: app_health_alerts
    rules:
      - alert: AppHttpProbeFailed
        expr: probe_success{job="blackbox_app_https"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "应用 HTTP 探测失败：{{ $labels.service }} {{ $labels.target }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-6h&to=now"

      - alert: AppBlackboxTargetDown
        expr: up{job="blackbox_app_https"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "应用 Blackbox 抓取目标不可用：{{ $labels.service }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-6h&to=now"

      - alert: AppHttpProbeSlow
        expr: probe_duration_seconds{job="blackbox_app_https"} > 2
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "应用 HTTP 探测响应缓慢：{{ $labels.service }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-6h&to=now"

      - alert: AppTlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_app_https"} - time() < 86400 * 30
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "应用 TLS 证书将在 30 天内到期：{{ $labels.target }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-30d&to=now"

  - name: business_probe_alerts
    rules:
      - alert: BusinessHttpProbeFailed
        expr: probe_success{scope="business"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务探测失败：{{ $labels.service }} {{ $labels.check }} {{ $labels.target }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-6h&to=now"

      - alert: BusinessBlackboxTargetDown
        expr: up{scope="business"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务 Blackbox 抓取目标不可用：{{ $labels.service }} {{ $labels.check }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-6h&to=now"

      - alert: BusinessHttpProbeSlow
        expr: probe_duration_seconds{scope="business"} > 3
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务探测响应缓慢：{{ $labels.service }} {{ $labels.check }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-6h&to=now"

      - alert: BusinessTlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{scope="business"} - time() < 86400 * 30
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务端点 TLS 证书将在 30 天内到期：{{ $labels.target }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-health?orgId=1&from=now-30d&to=now"

  - name: backup_alerts
    rules:
      - alert: BackupMetricsMissing
        expr: absent(backup_last_success_timestamp)
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "备份时效指标缺失"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupFreshnessWarning
        expr: time() - backup_last_success_timestamp > 20 * 3600 and time() - backup_last_success_timestamp <= 24 * 3600
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "备份接近 RPO 限制：{{ $labels.backup }}"
          description: "最新备份已超过 20 小时，距离突破 24 小时 RPO 剩余不足四小时。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupStale
        expr: time() - backup_last_success_timestamp > 24 * 3600
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "备份已过期：{{ $labels.backup }}"
          description: "最新备份已突破 24 小时 RPO。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupJobMetricsMissing
        expr: absent(backup_job_last_attempt_timestamp)
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "备份执行指标缺失"
          description: "受控备份运行器尚未发布尝试次数、结果和耗时指标。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: BackupJobFailed
        expr: backup_job_last_result == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "最新备份任务失败：{{ $labels.backup_job }}"
          description: "请在下一个 RPO 时限前检查受控备份任务的结果和日志。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupMetricsMissing
        expr: absent(r2_backup_last_success_timestamp)
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "R2 备份同步指标缺失"
          description: "异地 R2 备份同步尚未发布成功时间戳。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupFreshnessWarning
        expr: time() - r2_backup_last_success_timestamp > 20 * 3600 and time() - r2_backup_last_success_timestamp <= 24 * 3600
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "R2 备份同步接近 RPO 限制"
          description: "最近一次成功的 R2 同步已超过 20 小时。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

      - alert: R2BackupStale
        expr: time() - r2_backup_last_success_timestamp > 24 * 3600
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "R2 备份已过期"
          description: "异地 R2 备份同步已超过 24 小时 RPO 限制。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-services-backups/losangeles-services-backups?orgId=1&from=now-24h&to=now"

  - name: docker_alerts
    rules:
      - alert: DockerMetricsStale
        expr: absent(docker_metrics_last_run_timestamp) or time() - docker_metrics_last_run_timestamp > 900
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 运行时指标已过期"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: DockerMetricsCollectionFailed
        expr: docker_metrics_check_success == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 运行时指标采集失败"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: DockerContainerDown
        expr: docker_container_running == 0 and on() docker_metrics_check_success == 1
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 容器不可用：{{ $labels.name }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-6h&to=now"

      - alert: DockerContainerUnhealthy
        expr: docker_container_health_status{status="unhealthy"} == 1
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 健康检查异常：{{ $labels.name }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-6h&to=now"

      - alert: DockerContainerMemoryHigh
        expr: docker_container_memory_usage_ratio > 0.85 and docker_container_memory_usage_ratio <= 0.95
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 容器内存使用率偏高：{{ $labels.name }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-6h&to=now"

      - alert: DockerContainerMemoryCritical
        expr: docker_container_memory_usage_ratio > 0.95
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 容器内存使用率严重：{{ $labels.name }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-6h&to=now"

      - alert: DockerContainerPidsHigh
        expr: docker_container_pids_usage_ratio > 0.8
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 容器 PID 使用率偏高：{{ $labels.name }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-6h&to=now"

      - alert: DockerContainerOomKilled
        expr: docker_container_oom_killed == 1
        for: 0m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker 容器报告 OOMKilled：{{ $labels.name }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-service-overview/losangeles-service-overview?orgId=1&from=now-6h&to=now"

  - name: datastore_alerts
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Postgres Exporter 不可用：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-datastores/losangeles-datastores?orgId=1&from=now-6h&to=now"

      - alert: PostgresTooManyConnections
        expr: (sum by(instance) (pg_stat_activity_count) / max by(instance) (pg_settings_max_connections)) * 100 > 80
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Postgres 连接使用率偏高：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-datastores/losangeles-datastores?orgId=1&from=now-6h&to=now"

      - alert: PostgresDeadlocksDetected
        expr: increase(label_replace(pg_stat_database_deadlocks, "__name__", "pg_stat_database_deadlocks_total", "__name__", ".*")[15m:]) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "检测到 Postgres 死锁：{{ $labels.instance }} {{ $labels.datname }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-datastores/losangeles-datastores?orgId=1&from=now-6h&to=now"

      - alert: RedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Redis Exporter 不可用：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-datastores/losangeles-datastores?orgId=1&from=now-6h&to=now"

      - alert: RedisMemoryUsageHigh
        expr: redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Redis 内存使用率偏高：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-datastores/losangeles-datastores?orgId=1&from=now-6h&to=now"

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[15m]) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "检测到 Redis 拒绝连接：{{ $labels.instance }}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-datastores/losangeles-datastores?orgId=1&from=now-6h&to=now"

  - name: security_log_alerts
    rules:
      - alert: SecurityMetricsStale
        expr: absent(security_metrics_last_success_timestamp) or time() - security_metrics_last_success_timestamp > 300
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "安全 textfile 指标已过期"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: UfwDisabled
        expr: ufw_enabled == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "UFW 未处于 active 状态"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: UfwStatusCheckFailed
        expr: ufw_status_check_success == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "UFW 状态检查失败"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: AuditdServiceDown
        expr: auditd_service_active == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "auditd 未处于 active 状态"
          description: "系统命令和关键配置的审计日志记录不可用。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"auditd\", host=\"LosAngeles\"}"

      - alert: AuditdCheckFailed
        expr: auditd_check_success == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "auditd 状态或规则检查失败"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: AuditdKernelDisabled
        expr: auditd_kernel_enabled == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "内核审计子系统已禁用"
          description: "auditd 可能正在运行，但内核未接受审计规则或事件。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: AuditdRulesMissing
        expr: auditd_rules_loaded == 0 or auditd_required_rule_keys_present != auditd_required_rule_keys_expected
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "auditd 受管基线规则不完整"
          description: "请将 auditd_required_rule_keys_present 与预期数量比较，并检查 auditctl -l。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: AuditdEventsLost
        expr: auditd_lost_events > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "内核审计子系统报告事件丢失"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: AuditdBacklogHigh
        expr: auditd_backlog_limit > 0 and auditd_backlog / auditd_backlog_limit > 0.8
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "内核审计积压已超过 80%"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: Fail2banSshdCheckFailed
        expr: fail2ban_check_success{jail="sshd"} == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          description: "该告警持续超过设定阈值；请参照处理手册确认影响、定位根因并验证恢复。"
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Fail2ban sshd 状态检查失败"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"

      - alert: SshFailedLoginsHigh
        expr: ssh_failed_login_last_24h > 50
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "过去 24 小时 SSH 登录失败次数偏高"
          description: "请判断增长来自常规互联网扫描还是有针对性的登录尝试。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: SshInvalidUsersHigh
        expr: ssh_invalid_user_last_24h > 2000
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "过去 24 小时 SSH 无效用户探测次数偏高"
          description: "通常由自动化 SSH 扫描引起；请在安全面板中检查来源 IP 模式。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: Fail2banSshdBanBurst
        expr: clamp_min(delta(fail2ban_total_banned{jail="sshd"}[15m]), 0) > 10
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Fail2ban sshd 封禁活动急剧增加"
          description: "15 分钟内记录到超过 10 次新的 SSH 封禁。请在增强版 Fail2ban 面板中检查来源模式，确认是广泛扫描还是定向突发攻击。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: NginxHttp5xxHigh
        expr: nginx_http_requests_last_5m{status_class="5xx"} > 20
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Nginx 5xx 响应次数偏高"
          description: "请先检查 Nginx 错误和上游应用健康状况，再判断是外部流量还是服务故障。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\"} |~ \" 5[0-9][0-9] \""

      - alert: NginxHttp4xxHigh
        expr: nginx_http_requests_last_5m{status_class="4xx"} > 200
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Nginx 4xx 响应次数偏高"
          description: "大量 4xx 通常来自扫描器或无效路径；请检查 Nginx 日志中的来源和请求模式。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\"} |~ \" 4[0-9][0-9] \""

  - name: business_golden_signal_recording
    interval: 1m
    rules:
      - record: service:business_http_requests:sum_5m
        expr: sum by (service) (business_http_requests_last_5m)

      - record: service:business_http_4xx:ratio_5m
        expr: >-
          sum by (service) (business_http_4xx_last_5m)
          / clamp_min(sum by (service) (business_http_requests_last_5m), 1)

      - record: service:business_http_5xx:ratio_5m
        expr: >-
          sum by (service) (business_http_5xx_last_5m)
          / clamp_min(sum by (service) (business_http_requests_last_5m), 1)

      - record: service:business_http_slow:ratio_5m
        expr: >-
          sum by (service) (business_http_slow_requests_last_5m{threshold="2s"})
          / clamp_min(sum by (service) (business_http_requests_last_5m), 1)

  - name: business_log_alerts
    rules:
      - alert: BusinessLogMetricsStale
        expr: absent(business_log_metrics_last_success_timestamp) or time() - business_log_metrics_last_success_timestamp > 300
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务日志 textfile 指标已过期"
          description: "Nginx 业务日志指标脚本未生成新的 textfile 指标。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"}"

      - alert: BusinessHttp5xxHigh
        expr: business_http_5xx_last_5m > 5
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务 HTTP 5xx 响应次数偏高：{{ $labels.service }}"
          description: "该服务在最近五分钟 Nginx 业务日志窗口中出现超过 5 次 HTTP 5xx 响应。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \"host=\\\".*\\\"\" |~ \" 5[0-9][0-9] \""

      - alert: BusinessHttp4xxHigh
        expr: business_http_4xx_last_5m > 80
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务 HTTP 4xx 响应次数偏高：{{ $labels.service }}"
          description: "该服务在最近五分钟 Nginx 业务日志窗口中出现超过 80 次 HTTP 4xx 响应。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \" 4[0-9][0-9] \""

      - alert: BusinessSlowRequestsHigh
        expr: business_http_slow_requests_last_5m{threshold="2s"} > 10
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务 HTTP 慢请求次数偏高：{{ $labels.service }}"
          description: "该服务在最近五分钟窗口中有超过 10 个非流式请求的 Nginx request_time >= 2 秒。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \"request_time=([2-9]|[1-9][0-9]+)\\.\" != \"/v1/responses\""

      - alert: BusinessLogParseErrorsHigh
        expr: business_log_parse_errors_last_5m > 20
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务日志解析错误次数偏高"
          description: "业务日志指标解析器发现了不符合预期的增强版 Nginx 访问日志行。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"

  - name: daily_ops_audit_alerts
    rules:
