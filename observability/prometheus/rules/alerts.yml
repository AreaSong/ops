groups:
  - name: node_alerts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host down: {{ $labels.instance }}"

      - alert: DiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage high on {{ $labels.instance }} {{ $labels.mountpoint }}"

      - alert: DiskUsageCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage critical on {{ $labels.instance }} {{ $labels.mountpoint }}"

      - alert: MemoryUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage high on {{ $labels.instance }}"

      - alert: CpuUsageHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage high on {{ $labels.instance }}"

  - name: blackbox_alerts
    rules:
      - alert: HttpProbeFailed
        expr: probe_success{job="blackbox_https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTPS probe failed: {{ $labels.target }}"

      - alert: SslCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_https"} - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires within 30 days: {{ $labels.target }}"

      - alert: SslCertExpiringCritical
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_https"} - time() < 86400 * 7
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate expires within 7 days: {{ $labels.target }}"

  - name: app_health_alerts
    rules:
      - alert: AppHttpProbeFailed
        expr: probe_success{job="blackbox_app_https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application HTTP probe failed: {{ $labels.service }} {{ $labels.target }}"

      - alert: AppBlackboxTargetDown
        expr: up{job="blackbox_app_https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application blackbox scrape target down: {{ $labels.service }}"

      - alert: AppHttpProbeSlow
        expr: probe_duration_seconds{job="blackbox_app_https"} > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Application HTTP probe is slow: {{ $labels.service }}"

      - alert: AppTlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_app_https"} - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Application TLS certificate expires within 30 days: {{ $labels.target }}"

  - name: business_probe_alerts
    rules:
      - alert: BusinessHttpProbeFailed
        expr: probe_success{scope="business"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Business probe failed: {{ $labels.service }} {{ $labels.check }} {{ $labels.target }}"

      - alert: BusinessBlackboxTargetDown
        expr: up{scope="business"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Business blackbox scrape target down: {{ $labels.service }} {{ $labels.check }}"

      - alert: BusinessHttpProbeSlow
        expr: probe_duration_seconds{scope="business"} > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business probe is slow: {{ $labels.service }} {{ $labels.check }}"

      - alert: BusinessTlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{scope="business"} - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Business endpoint TLS certificate expires within 30 days: {{ $labels.target }}"

  - name: backup_alerts
    rules:
      - alert: BackupMetricsMissing
        expr: absent(backup_last_success_timestamp)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Backup freshness metrics are missing"

      - alert: BackupStale
        expr: time() - backup_last_success_timestamp > 30 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Backup stale: {{ $labels.backup }}"

      - alert: R2BackupStale
        expr: absent(r2_backup_last_success_timestamp) or time() - r2_backup_last_success_timestamp > 36 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "R2 backup stale"

  - name: docker_alerts
    rules:
      - alert: DockerContainerDown
        expr: docker_container_running == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Docker container down: {{ $labels.name }}"

  - name: datastore_alerts
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter down: {{ $labels.instance }}"

      - alert: PostgresTooManyConnections
        expr: (sum by(instance) (pg_stat_activity_count) / max by(instance) (pg_settings_max_connections)) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection usage high: {{ $labels.instance }}"

      - alert: PostgresDeadlocksDetected
        expr: increase(pg_stat_database_deadlocks[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Postgres deadlocks detected: {{ $labels.instance }} {{ $labels.datname }}"

      - alert: RedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter down: {{ $labels.instance }}"

      - alert: RedisMemoryUsageHigh
        expr: redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high: {{ $labels.instance }}"

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Redis rejected connections detected: {{ $labels.instance }}"

  - name: security_log_alerts
    rules:
      - alert: SecurityMetricsStale
        expr: absent(security_metrics_last_success_timestamp) or time() - security_metrics_last_success_timestamp > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Security textfile metrics are stale"

      - alert: UfwDisabled
        expr: ufw_enabled == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "UFW is not active"

      - alert: UfwStatusCheckFailed
        expr: ufw_status_check_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UFW status check failed"

      - alert: Fail2banSshdCheckFailed
        expr: fail2ban_check_success{jail="sshd"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fail2ban sshd status check failed"

      - alert: SshFailedLoginsHigh
        expr: ssh_failed_login_last_24h > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSH failed logins are high over the last 24 hours"
          description: "Check whether the increase is normal internet scanning or targeted login attempts."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: SshInvalidUsersHigh
        expr: ssh_invalid_user_last_24h > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSH invalid user probes are high over the last 24 hours"
          description: "Usually caused by automated SSH scanning. Check the security dashboard for source IP patterns."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: Fail2banSshdCurrentlyBanning
        expr: fail2ban_currently_banned{jail="sshd"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Fail2ban sshd currently has banned addresses"
          description: "Fail2ban is actively blocking SSH sources. Check the enriched Fail2ban panel for IP, country, ASN, BGP prefix and network organization."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: NginxHttp5xxHigh
        expr: nginx_http_requests_last_5m{status_class="5xx"} > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nginx 5xx responses are high"
          description: "Check Nginx errors and upstream application health before deciding whether this is external traffic or service failure."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\"} |~ \" 5[0-9][0-9] \""

      - alert: NginxHttp4xxHigh
        expr: nginx_http_requests_last_5m{status_class="4xx"} > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Nginx 4xx responses are high"
          description: "High 4xx volume is often scanners or invalid paths. Check Nginx logs for source and request patterns."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\"} |~ \" 4[0-9][0-9] \""

  - name: business_log_alerts
    rules:
      - alert: BusinessLogMetricsStale
        expr: absent(business_log_metrics_last_success_timestamp) or time() - business_log_metrics_last_success_timestamp > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Business log textfile metrics are stale"
          description: "The Nginx business log metrics script has not produced fresh textfile metrics."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"}"

      - alert: BusinessHttp5xxHigh
        expr: business_http_5xx_last_5m > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Business HTTP 5xx responses are high: {{ $labels.service }}"
          description: "The service has more than 5 HTTP 5xx responses in the latest 5-minute Nginx business log window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \"host=\\\".*\\\"\" |~ \" 5[0-9][0-9] \""

      - alert: BusinessHttp4xxHigh
        expr: business_http_4xx_last_5m > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business HTTP 4xx responses are high: {{ $labels.service }}"
          description: "The service has more than 80 HTTP 4xx responses in the latest 5-minute Nginx business log window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \" 4[0-9][0-9] \""

      - alert: BusinessSlowRequestsHigh
        expr: business_http_slow_requests_last_5m{threshold="2s"} > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business HTTP slow requests are high: {{ $labels.service }}"
          description: "The service has more than 10 non-streaming requests with Nginx request_time >= 2s in the latest 5-minute window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \"request_time=([2-9]|[1-9][0-9]+)\\.\" != \"/v1/responses\""

      - alert: BusinessLogParseErrorsHigh
        expr: business_log_parse_errors_last_5m > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business log parse errors are high"
          description: "The business log metrics parser is seeing unexpected enhanced Nginx access log lines."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"

  - name: cloudflare_origin_cert_alerts
    rules:
      - alert: CloudflareOriginCertMetricsStale
        expr: absent(cloudflare_origin_cert_metrics_last_run_timestamp) or time() - cloudflare_origin_cert_metrics_last_run_timestamp > 3 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate metrics are stale"
          description: "The local Cloudflare Origin certificate metrics script has not produced fresh textfile metrics."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"


      - alert: CloudflareOriginCertCheckFailed
        expr: cloudflare_origin_cert_check_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate check failed: {{ $labels.cert }}"
          description: "The local Cloudflare Origin certificate file cannot be read or parsed. Check the certificate path and permissions."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring180Days
        expr: cloudflare_origin_cert_days_until_expiry < 180 and cloudflare_origin_cert_days_until_expiry >= 90
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate expires within 180 days: {{ $labels.cert }}"
          description: "Start planning renewal. This is the first long-range reminder for the Origin Certificate rotation window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring90Days
        expr: cloudflare_origin_cert_days_until_expiry < 90 and cloudflare_origin_cert_days_until_expiry >= 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate expires within 90 days: {{ $labels.cert }}"
          description: "Prepare the new Origin Certificate and schedule a low-risk rotation window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring30Days
        expr: cloudflare_origin_cert_days_until_expiry < 30 and cloudflare_origin_cert_days_until_expiry >= 7
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate expires within 30 days: {{ $labels.cert }}"
          description: "Rotate the Origin Certificate soon and validate Cloudflare Full strict back-to-origin TLS."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiringCritical
        expr: cloudflare_origin_cert_days_until_expiry < 7
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflare Origin certificate expires within 7 days: {{ $labels.cert }}"
          description: "Rotate the Origin Certificate immediately to avoid Cloudflare Full strict origin TLS failure."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"
