          summary: "安全关键配置发生漂移：{{ $labels.service_id }} {{ $labels.hostname }}"
          description: "某条受 Cloudflare 保护的 Nginx 路由缺少预期后端、真实 IP 信任链或源站白名单。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now"

      - alert: ControlledConfigurationDrift
        expr: ops_config_drift{severity="warning"} == 1
        for: 30m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "受控配置发生漂移：{{ $labels.service_id }}"
          description: "运行时 Compose 文件与 Git 受控的恢复副本不一致。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now"

      - alert: DockerBuildCachePruneStale
        expr: absent(docker_build_cache_prune_last_success_timestamp) or time() - docker_build_cache_prune_last_success_timestamp > 8 * 86400
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
          scope: host
          service: docker
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker BuildKit 缓存清理已过期"
          description: "每周清理已连续八天未发布成功结果；请检查 cron、锁和清理日志。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-14d&to=now"

      - alert: DockerBuildCacheExcessive
        expr: docker_storage_reclaimable_bytes{type="build_cache"} > 10 * 1024 * 1024 * 1024
        for: 6h
        labels:
          owner: areasong-ops
          severity: warning
          scope: host
          service: docker
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Docker BuildKit 可回收缓存超过 10 GiB"
          description: "清理宽限期结束后，未使用的构建缓存仍高于主机预算。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-14d&to=now"

      - alert: BusinessErrorLogStale
        expr: absent(business_error_log_last_success_timestamp) or time() - business_error_log_last_success_timestamp > 180
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "已脱敏业务错误日志采集器已过期"
          description: "resume、Account Vault、sub2api 和 AreaForge 的采集器未能在三分钟内完成。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-runtime?orgId=1&from=now-6h&to=now"

      - alert: BusinessErrorLogCheckFailed
        expr: business_error_log_check_success == 0 or business_error_log_source_failures > 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "已脱敏业务错误日志采集器无法读取全部来源"
          description: "请检查配置的 Docker 容器名称和采集器权限。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-runtime?orgId=1&from=now-6h&to=now"

      - alert: BusinessErrorEventsBurst
        expr: business_error_log_events_last_run > 20
        for: 0m
        labels:
          owner: areasong-ops
          severity: warning
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "业务警告/错误事件急剧增加"
          description: "一次采集运行中记录到超过二十条已脱敏的警告/错误事件。"
          loki_query: "{job=\"business_errors\", host=\"LosAngeles\"}"
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-runtime?orgId=1&from=now-6h&to=now"

