groups:
  - name: node_alerts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host down: {{ $labels.instance }}"

      - alert: DiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage high on {{ $labels.instance }} {{ $labels.mountpoint }}"

      - alert: DiskUsageCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage critical on {{ $labels.instance }} {{ $labels.mountpoint }}"

      - alert: MemoryUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage high on {{ $labels.instance }}"

      - alert: CpuUsageHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage high on {{ $labels.instance }}"

  - name: blackbox_alerts
    rules:
      - alert: GrafanaInternalProbeFailed
        expr: probe_success{job="blackbox_grafana_internal"} == 0
        for: 2m
        labels:
          severity: critical
          service: grafana
        annotations:
          summary: "Grafana internal readiness probe failed"
          description: "The local Grafana API health endpoint is unavailable independently of Cloudflare Access."

      - alert: HttpProbeFailed
        expr: probe_success{job="blackbox_https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTPS probe failed: {{ $labels.target }}"

      - alert: SslCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_https"} - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires within 30 days: {{ $labels.target }}"

      - alert: SslCertExpiringCritical
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_https"} - time() < 86400 * 7
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate expires within 7 days: {{ $labels.target }}"

  - name: app_health_alerts
    rules:
      - alert: AppHttpProbeFailed
        expr: probe_success{job="blackbox_app_https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application HTTP probe failed: {{ $labels.service }} {{ $labels.target }}"

      - alert: AppBlackboxTargetDown
        expr: up{job="blackbox_app_https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application blackbox scrape target down: {{ $labels.service }}"

      - alert: AppHttpProbeSlow
        expr: probe_duration_seconds{job="blackbox_app_https"} > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Application HTTP probe is slow: {{ $labels.service }}"

      - alert: AppTlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox_app_https"} - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Application TLS certificate expires within 30 days: {{ $labels.target }}"

  - name: business_probe_alerts
    rules:
      - alert: BusinessHttpProbeFailed
        expr: probe_success{scope="business"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Business probe failed: {{ $labels.service }} {{ $labels.check }} {{ $labels.target }}"

      - alert: BusinessBlackboxTargetDown
        expr: up{scope="business"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Business blackbox scrape target down: {{ $labels.service }} {{ $labels.check }}"

      - alert: BusinessHttpProbeSlow
        expr: probe_duration_seconds{scope="business"} > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business probe is slow: {{ $labels.service }} {{ $labels.check }}"

      - alert: BusinessTlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{scope="business"} - time() < 86400 * 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Business endpoint TLS certificate expires within 30 days: {{ $labels.target }}"

  - name: backup_alerts
    rules:
      - alert: BackupMetricsMissing
        expr: absent(backup_last_success_timestamp)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Backup freshness metrics are missing"

      - alert: BackupStale
        expr: time() - backup_last_success_timestamp > 30 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Backup stale: {{ $labels.backup }}"

      - alert: R2BackupStale
        expr: absent(r2_backup_last_success_timestamp) or time() - r2_backup_last_success_timestamp > 36 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "R2 backup stale"

  - name: docker_alerts
    rules:
      - alert: DockerMetricsStale
        expr: absent(docker_metrics_last_run_timestamp) or time() - docker_metrics_last_run_timestamp > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Docker runtime metrics are stale"

      - alert: DockerMetricsCollectionFailed
        expr: docker_metrics_check_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Docker runtime metrics collection failed"

      - alert: DockerContainerDown
        expr: docker_container_running == 0 and on() docker_metrics_check_success == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Docker container down: {{ $labels.name }}"

      - alert: DockerContainerUnhealthy
        expr: docker_container_health_status{status="unhealthy"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Docker health check is unhealthy: {{ $labels.name }}"

      - alert: DockerContainerMemoryHigh
        expr: docker_container_memory_usage_ratio > 0.85 and docker_container_memory_usage_ratio <= 0.95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Docker container memory usage is high: {{ $labels.name }}"

      - alert: DockerContainerMemoryCritical
        expr: docker_container_memory_usage_ratio > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Docker container memory usage is critical: {{ $labels.name }}"

      - alert: DockerContainerPidsHigh
        expr: docker_container_pids_usage_ratio > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Docker container PID usage is high: {{ $labels.name }}"

      - alert: DockerContainerOomKilled
        expr: docker_container_oom_killed == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Docker container reports OOMKilled: {{ $labels.name }}"

  - name: datastore_alerts
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter down: {{ $labels.instance }}"

      - alert: PostgresTooManyConnections
        expr: (sum by(instance) (pg_stat_activity_count) / max by(instance) (pg_settings_max_connections)) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection usage high: {{ $labels.instance }}"

      - alert: PostgresDeadlocksDetected
        expr: increase(pg_stat_database_deadlocks[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Postgres deadlocks detected: {{ $labels.instance }} {{ $labels.datname }}"

      - alert: RedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter down: {{ $labels.instance }}"

      - alert: RedisMemoryUsageHigh
        expr: redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high: {{ $labels.instance }}"

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Redis rejected connections detected: {{ $labels.instance }}"

  - name: security_log_alerts
    rules:
      - alert: SecurityMetricsStale
        expr: absent(security_metrics_last_success_timestamp) or time() - security_metrics_last_success_timestamp > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Security textfile metrics are stale"

      - alert: UfwDisabled
        expr: ufw_enabled == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "UFW is not active"

      - alert: UfwStatusCheckFailed
        expr: ufw_status_check_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UFW status check failed"

      - alert: AuditdServiceDown
        expr: auditd_service_active == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "auditd is not active"
          description: "System command and critical configuration audit logging is unavailable."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"auditd\", host=\"LosAngeles\"}"

      - alert: AuditdCheckFailed
        expr: auditd_check_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "auditd status or rule check failed"

      - alert: AuditdKernelDisabled
        expr: auditd_kernel_enabled == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The kernel audit subsystem is disabled"
          description: "auditd may be running, but the kernel is not accepting audit rules or events."

      - alert: AuditdRulesMissing
        expr: auditd_rules_loaded == 0 or auditd_required_rule_keys_present != auditd_required_rule_keys_expected
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "auditd managed baseline rules are incomplete"
          description: "Compare auditd_required_rule_keys_present with the expected count and inspect auditctl -l."

      - alert: AuditdEventsLost
        expr: auditd_lost_events > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "The kernel audit subsystem reports lost events"

      - alert: AuditdBacklogHigh
        expr: auditd_backlog_limit > 0 and auditd_backlog / auditd_backlog_limit > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The kernel audit backlog is above 80 percent"

      - alert: Fail2banSshdCheckFailed
        expr: fail2ban_check_success{jail="sshd"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fail2ban sshd status check failed"

      - alert: SshFailedLoginsHigh
        expr: ssh_failed_login_last_24h > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSH failed logins are high over the last 24 hours"
          description: "Check whether the increase is normal internet scanning or targeted login attempts."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: SshInvalidUsersHigh
        expr: ssh_invalid_user_last_24h > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSH invalid user probes are high over the last 24 hours"
          description: "Usually caused by automated SSH scanning. Check the security dashboard for source IP patterns."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: Fail2banSshdCurrentlyBanning
        expr: fail2ban_currently_banned{jail="sshd"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Fail2ban sshd currently has banned addresses"
          description: "Fail2ban is actively blocking SSH sources. Check the enriched Fail2ban panel for IP, country, ASN, BGP prefix and network organization."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-24h&to=now"
          loki_query: "{job=\"fail2ban_enriched\", host=\"LosAngeles\"} | json"

      - alert: NginxHttp5xxHigh
        expr: nginx_http_requests_last_5m{status_class="5xx"} > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nginx 5xx responses are high"
          description: "Check Nginx errors and upstream application health before deciding whether this is external traffic or service failure."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\"} |~ \" 5[0-9][0-9] \""

      - alert: NginxHttp4xxHigh
        expr: nginx_http_requests_last_5m{status_class="4xx"} > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Nginx 4xx responses are high"
          description: "High 4xx volume is often scanners or invalid paths. Check Nginx logs for source and request patterns."
          grafana_url: "https://monitor.areasong.top/d/losangeles-security-overview/losangeles-security-overview?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\"} |~ \" 4[0-9][0-9] \""

  - name: business_log_alerts
    rules:
      - alert: BusinessLogMetricsStale
        expr: absent(business_log_metrics_last_success_timestamp) or time() - business_log_metrics_last_success_timestamp > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Business log textfile metrics are stale"
          description: "The Nginx business log metrics script has not produced fresh textfile metrics."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"}"

      - alert: BusinessHttp5xxHigh
        expr: business_http_5xx_last_5m > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Business HTTP 5xx responses are high: {{ $labels.service }}"
          description: "The service has more than 5 HTTP 5xx responses in the latest 5-minute Nginx business log window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \"host=\\\".*\\\"\" |~ \" 5[0-9][0-9] \""

      - alert: BusinessHttp4xxHigh
        expr: business_http_4xx_last_5m > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business HTTP 4xx responses are high: {{ $labels.service }}"
          description: "The service has more than 80 HTTP 4xx responses in the latest 5-minute Nginx business log window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \" 4[0-9][0-9] \""

      - alert: BusinessSlowRequestsHigh
        expr: business_http_slow_requests_last_5m{threshold="2s"} > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business HTTP slow requests are high: {{ $labels.service }}"
          description: "The service has more than 10 non-streaming requests with Nginx request_time >= 2s in the latest 5-minute window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"
          loki_query: "{job=\"nginx\", host=\"LosAngeles\", filename=\"/var/log/nginx/ops-business-access.log\"} |~ \"request_time=([2-9]|[1-9][0-9]+)\\.\" != \"/v1/responses\""

      - alert: BusinessLogParseErrorsHigh
        expr: business_log_parse_errors_last_5m > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Business log parse errors are high"
          description: "The business log metrics parser is seeing unexpected enhanced Nginx access log lines."
          grafana_url: "https://monitor.areasong.top/d/losangeles-app-health/losangeles-app-and-business-health?orgId=1&from=now-6h&to=now"

  - name: daily_ops_audit_alerts
    rules:
      - alert: DailyOpsAuditStale
        expr: absent(daily_ops_audit_last_success_timestamp) or time() - daily_ops_audit_last_success_timestamp > 28 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Daily operations audit is missing or stale"
          description: "The previous UTC day audit should be generated by 00:20 UTC."

      - alert: DailyOpsAuditCriticalFindings
        expr: daily_ops_audit_findings{severity="critical"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Daily operations audit contains critical findings"
          description: "Review the daily audit email and dashboard before changing production."

      - alert: DailyOpsAuditDataSourceFailure
        expr: daily_ops_audit_data_source_failures > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Daily operations audit could not read all data sources"

      - alert: DailyOpsAuditDeliveryFailed
        expr: daily_ops_audit_delivery{state="attempted"} == 1 and on() daily_ops_audit_delivery{state="accepted"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Daily operations audit email was not accepted by Alertmanager"

  - name: runtime_asset_and_business_error_alerts
    rules:
      - alert: RuntimeSnapshotStale
        expr: absent(ops_runtime_snapshot_last_success_timestamp) or time() - ops_runtime_snapshot_last_success_timestamp > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LosAngeles runtime asset snapshot is stale"
          description: "The sanitized service, listener, container, and drift snapshot has not completed in three minutes."
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now"

      - alert: RuntimeSnapshotCheckFailed
        expr: ops_runtime_snapshot_check_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LosAngeles runtime asset snapshot is incomplete"
          description: "At least one inventory, systemd, listener, Docker, or drift collector failed."
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now"

      - alert: SecurityCriticalConfigurationDrift
        expr: ops_config_drift{severity="critical"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Security-critical configuration drift: {{ $labels.service_id }} {{ $labels.hostname }}"
          description: "A Cloudflare-protected Nginx route is missing its expected backend, real-IP trust chain, or origin allowlist."
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now"

      - alert: ControlledConfigurationDrift
        expr: ops_config_drift{severity="warning"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Controlled configuration drift: {{ $labels.service_id }}"
          description: "The runtime Compose file differs from its Git-controlled recovery copy."
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now"

      - alert: BusinessErrorLogStale
        expr: absent(business_error_log_last_success_timestamp) or time() - business_error_log_last_success_timestamp > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sanitized business error log collector is stale"
          description: "The collector for resume, Account Vault, sub2api, and AreaForge has not completed in three minutes."

      - alert: BusinessErrorLogCheckFailed
        expr: business_error_log_check_success == 0 or business_error_log_source_failures > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sanitized business error log collector cannot read every source"
          description: "Check the configured Docker container names and collector permissions."

      - alert: BusinessErrorEventsBurst
        expr: business_error_log_events_last_run > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Business warning/error events increased sharply"
          description: "More than twenty sanitized warning/error events were recorded in one collector run."
          loki_query: "{job=\"business_errors\", host=\"LosAngeles\"}"

  - name: cloudflare_origin_cert_alerts
    rules:
      - alert: CloudflareIpRangeMetricsStale
        expr: absent(cloudflare_ip_ranges_last_run_timestamp) or time() - cloudflare_ip_ranges_last_run_timestamp > 36 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare IP range comparison is stale"
          description: "The daily comparison with Cloudflare's official IPv4 and IPv6 lists has not completed."

      - alert: CloudflareIpRangeCheckFailed
        expr: cloudflare_ip_ranges_check_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare IP range comparison failed"
          description: "The official list could not be fetched or a managed CIDR file is invalid."

      - alert: CloudflareIpRangeDrift
        expr: cloudflare_ip_ranges_match == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Managed Cloudflare {{ $labels.family }} ranges differ from the official list"
          description: "Review the official change, update the Git-managed CIDRs, run nginx -t, and reload only after approval."

      - alert: CloudflareOriginCertMetricsStale
        expr: absent(cloudflare_origin_cert_metrics_last_run_timestamp) or time() - cloudflare_origin_cert_metrics_last_run_timestamp > 3 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate metrics are stale"
          description: "The local Cloudflare Origin certificate metrics script has not produced fresh textfile metrics."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"


      - alert: CloudflareOriginCertCheckFailed
        expr: cloudflare_origin_cert_check_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate check failed: {{ $labels.cert }}"
          description: "The local Cloudflare Origin certificate file cannot be read or parsed. Check the certificate path and permissions."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring180Days
        expr: cloudflare_origin_cert_days_until_expiry < 180 and cloudflare_origin_cert_days_until_expiry >= 90
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate expires within 180 days: {{ $labels.cert }}"
          description: "Start planning renewal. This is the first long-range reminder for the Origin Certificate rotation window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring90Days
        expr: cloudflare_origin_cert_days_until_expiry < 90 and cloudflare_origin_cert_days_until_expiry >= 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate expires within 90 days: {{ $labels.cert }}"
          description: "Prepare the new Origin Certificate and schedule a low-risk rotation window."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiring30Days
        expr: cloudflare_origin_cert_days_until_expiry < 30 and cloudflare_origin_cert_days_until_expiry >= 7
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cloudflare Origin certificate expires within 30 days: {{ $labels.cert }}"
          description: "Rotate the Origin Certificate soon and validate Cloudflare Full strict back-to-origin TLS."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

      - alert: CloudflareOriginCertExpiringCritical
        expr: cloudflare_origin_cert_days_until_expiry < 7
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Cloudflare Origin certificate expires within 7 days: {{ $labels.cert }}"
          description: "Rotate the Origin Certificate immediately to avoid Cloudflare Full strict origin TLS failure."
          grafana_url: "https://monitor.areasong.top/d/losangeles-certificates-cloudflare/losangeles-certificates-and-cloudflare?orgId=1&from=now-30d&to=now"

  - name: sub2api_capacity_symptom_alerts
    rules:
      - alert: Sub2apiCapacityMetricsStale
        expr: absent(sub2api_capacity_metrics_last_run_timestamp) or time() - sub2api_capacity_metrics_last_run_timestamp > 660
        for: 5m
        labels:
          severity: warning
          scope: business
          service: sub2api
        annotations:
          summary: "sub2api capacity symptom metrics are stale"
          description: "The Docker log symptom collector missed its five-minute cadence for more than one full cycle (11 minutes)."
          grafana_url: "https://monitor.areasong.top/d/sub2api-slo-capacity/sub2api-slo-and-capacity?orgId=1&from=now-6h&to=now"

      - alert: Sub2apiLogCheckFailed
        expr: sub2api_log_check_success == 0
        for: 5m
        labels:
          severity: warning
          scope: business
          service: sub2api
        annotations:
          summary: "sub2api Docker log symptom check failed"
          description: "Check that the sub2api container exists and the collector can read Docker logs."

      - alert: Sub2apiNoAvailableAccountWarning
        expr: sub2api_no_available_account_events_last_5m > 0 and sub2api_no_available_account_events_last_5m < 10
        for: 2m
        labels:
          severity: warning
          scope: business
          service: sub2api
        annotations:
          summary: "sub2api has no available account events"
          description: "The application reported {{ $value }} no-available-account events in the latest five-minute window."
          grafana_url: "https://monitor.areasong.top/d/sub2api-slo-capacity/sub2api-slo-and-capacity?orgId=1&from=now-6h&to=now"

      - alert: Sub2apiNoAvailableAccountCritical
        expr: sub2api_no_available_account_events_last_5m >= 10
        for: 2m
        labels:
          severity: critical
          scope: business
          service: sub2api
        annotations:
          summary: "sub2api account pool is unavailable at high frequency"
          description: "At least ten no-available-account events were observed in the latest five-minute window."
          grafana_url: "https://monitor.areasong.top/d/sub2api-slo-capacity/sub2api-slo-and-capacity?orgId=1&from=now-6h&to=now"

  - name: xray_traffic_audit_alerts
    rules:
      - alert: XrayTrafficMetricsStale
        expr: absent(xray_traffic_metrics_last_run_timestamp) or time() - xray_traffic_metrics_last_run_timestamp > 300
        for: 10m
        labels:
          severity: warning
          scope: business
          service: x-ui
        annotations:
          summary: "xray traffic audit metrics are stale"
          description: "The xray outbound traffic collector has not completed successfully in the last five minutes."
          grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

      - alert: XrayTrafficStatsQueryFailed
        expr: xray_traffic_metrics_check_success == 0
        for: 10m
        labels:
          severity: warning
          scope: business
          service: x-ui
        annotations:
          summary: "xray statsquery API is failing"
          description: "The collector cannot read outbound traffic counters from the xray API on 127.0.0.1:62789."
          grafana_url: "https://monitor.areasong.top/d/losangeles-xray-traffic-audit/liu-liang-shen-ji?orgId=1&from=now-6h&to=now"

  - name: release_governance_alerts
    rules:
      - alert: AccountVaultReleaseMetricsMissing
        expr: absent(account_vault_release_last_success)
        for: 15m
        labels:
          severity: warning
          scope: deployment
          service: account-vault
        annotations:
          summary: "Account Vault release evidence metric is missing"
          description: "Deploy the controlled release script and verify that the node-exporter textfile collector reads account-vault-release.prom."

      - alert: AccountVaultReleaseFailed
        expr: account_vault_release_last_success == 0
        for: 0m
        labels:
          severity: critical
          scope: deployment
          service: account-vault
        annotations:
          summary: "The latest Account Vault release action failed"
          description: "Inspect the release log, retained compose snapshot, current/previous image state, and service health before retrying."
          grafana_url: "https://monitor.areasong.top/d/losangeles-server-asset-runtime/losangeles-server-asset-and-runtime?orgId=1&from=now-6h&to=now"

      - alert: AlertmanagerGitHubIssueSyncDisabled
        expr: absent(alertmanager_github_issue_sync_configured) or alertmanager_github_issue_sync_configured == 0
        for: 15m
        labels:
          severity: warning
          scope: alerting
        annotations:
          summary: "Alertmanager critical-alert GitHub Issue sync is disabled"
          description: "Provision the root-only GitHub token configuration or explicitly document a temporary risk acceptance."

      - alert: AlertmanagerGitHubIssueSyncFailed
        expr: alertmanager_github_issue_sync_success == 0
        for: 10m
        labels:
          severity: warning
          scope: alerting
        annotations:
          summary: "Alertmanager critical-alert GitHub Issue sync failed"
          description: "Check local Alertmanager access, the fine-grained GitHub token, repository scope, and the sync log."

      - alert: AlertmanagerGitHubIssueSyncStale
        expr: alertmanager_github_issue_sync_configured == 1 and time() - alertmanager_github_issue_sync_last_success_timestamp > 900
        for: 5m
        labels:
          severity: warning
          scope: alerting
        annotations:
          summary: "Alertmanager critical-alert GitHub Issue sync is stale"
          description: "The five-minute host job has not published a fresh sync result."
