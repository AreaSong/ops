groups:
  - name: observability_component_alerts
    rules:
      - alert: GrafanaMetricsTargetDown
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: grafana
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Grafana 指标端点不可用"
          description: "Grafana 就绪状态和指标是分别监控的；此告警表示 Prometheus 无法抓取 Grafana 指标。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: GrafanaDatasourceRequestErrors
        expr: sum by (instance, datasource, datasource_type) (increase(grafana_datasource_request_total{job="grafana",code=~"5.."}[5m])) > 5
        for: 2m
        labels:
          owner: areasong-ops
          severity: warning
          service: grafana
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Grafana 数据源 {{ $labels.datasource }} 重复返回 5xx"
          description: "Grafana 在五分钟内记录到 {{ $labels.datasource }}（{{ $labels.datasource_type }}）超过五次 5xx 响应；请检查该数据源及其上游查询服务。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: AlertmanagerMetricsTargetDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: alertmanager
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Alertmanager 指标端点不可用"
          description: "Prometheus 无法抓取 Alertmanager；活动告警仍会显示在 Prometheus 中，但通知可能无法送达。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: BlackboxExporterMetricsTargetDown
        expr: up{job="blackbox_exporter"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: blackbox-exporter
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Blackbox Exporter 指标端点不可用"
          description: "共享 Exporter 不可用时，合成探测告警可能批量出现；请先调查此根因告警。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful{job="alertmanager"} == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
          service: alertmanager
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Alertmanager 拒绝了最新配置重载"
          description: "Alertmanager 仍使用上一份配置运行；请先校验并重载目标配置，再依赖路由变更。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: AlertmanagerRuntimeInputCheckFailed
        expr: alertmanager_runtime_input_check_success{job="node"} == 0 or absent(alertmanager_runtime_input_check_success{job="node"}) or time() - alertmanager_runtime_input_last_check_timestamp_seconds{job="node"} > 180
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
          service: alertmanager
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Alertmanager 运行输入检查失效"
          description: "主机侧检查无法持续确认 Alertmanager 已加载当前配置、模板和 SMTP 凭据；请先恢复采集器再信任加载状态。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: AlertmanagerRuntimeInputNotLoaded
        expr: alertmanager_runtime_input_stale{job="node"} == 1
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
          service: alertmanager
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Alertmanager 尚未加载最新 {{ $labels.kind }} 输入"
          description: "主机配置、模板或 SMTP 凭据比 Alertmanager 对应加载时间更新；校验后重载配置，凭据原子替换则必须重建 Alertmanager 容器。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: AlertmanagerNotificationFailures
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total{job="alertmanager"}[10m])) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: critical
          service: alertmanager
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Alertmanager 通知投递失败：{{ $labels.integration }}"
          description: "最近十分钟内至少有一条通知失败；请验证接收器和独立的 GitHub 看门狗链路。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful{job="prometheus"} == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
          service: prometheus
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Prometheus 拒绝了最新配置重载"
          description: "Prometheus 仍使用上一份配置运行；再次重载前请校验规则和抓取配置。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: PrometheusWalCorruptionDetected
        expr: sum(increase(prometheus_tsdb_wal_corruptions_total{job="prometheus"}[15m])) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: critical
          service: prometheus
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Prometheus 检测到 WAL 损坏"
          description: "Prometheus 在最近十五分钟报告了新的预写日志损坏；请保留证据并检查 TSDB 恢复日志。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: PrometheusRuleEvaluationFailures
        expr: sum(increase(prometheus_rule_evaluation_failures_total{job="prometheus"}[10m])) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: warning
          service: prometheus
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Prometheus 规则评估失败"
          description: "最近十分钟内至少有一条记录或告警规则评估失败；信任派生信号前请检查失败的规则组。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: PrometheusNotificationsDropped
        expr: sum(increase(prometheus_notifications_dropped_total{job="prometheus"}[10m])) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: critical
          service: prometheus
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Prometheus 丢弃了告警通知"
          description: "最近十分钟内 Prometheus 至少丢弃了一条发往 Alertmanager 的通知；请检查队列容量和 Alertmanager 连通性。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: NodeTextfileScrapeError
        expr: node_textfile_scrape_error{job="node"} == 1
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
          service: node-exporter
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Node Exporter 无法读取一个或多个 textfile 指标"
          description: "格式错误或不可读的 textfile collector 文件已导致主机任务指标至少五分钟不可见；请检查采集器日志和最近的指标文件。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: PromtailLogEntriesDropped
        expr: sum(increase(promtail_dropped_entries_total{job="promtail"}[10m])) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: warning
          service: promtail
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Promtail 丢弃了日志条目"
          description: "最近十分钟内 Promtail 丢弃了一条或多条日志；请检查拒绝原因、客户端重试和 Loki 限制。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: LokiWalSamplesDiscarded
        expr: sum(increase(loki_ingester_wal_discarded_samples_total{job="loki"}[15m])) > 0
        for: 0m
        labels:
          owner: areasong-ops
          severity: critical
          service: loki
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Loki 丢弃了 WAL 样本"
          description: "Loki 在最近十五分钟回放或写入 WAL 时丢弃了一条或多条样本；请检查 ingester 日志和存储健康状态。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: BlackboxExporterConfigReloadFailed
        expr: blackbox_exporter_config_last_reload_successful{job="blackbox_exporter"} == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
          service: blackbox-exporter
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Blackbox Exporter 拒绝了最新配置重载"
          description: "Blackbox Exporter 仍使用上一份配置运行；重试重载前请校验模块。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

  - name: loki_compactor_alerts
    rules:
      - alert: LokiCompactorNotRunning
        expr: loki_boltdb_shipper_compactor_running{job="loki"} != 1
        for: 15m
        labels:
          owner: areasong-ops
          severity: critical
          service: loki
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Loki compactor 未运行"
          description: "compactor 超过启动稳定窗口仍未活动；保留清理和索引压缩可能已停滞。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: LokiRetentionApplyStalled
        expr: |
          (
            up{job="loki"} == 1
            unless on (job, instance)
            loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="loki"}
          )
          or
          (
            loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="loki"} == 0
            and on (job, instance)
            time() - process_start_time_seconds{job="loki"} > 3600
          )
          or
          (
            loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="loki"} > 0
            and
            time() - loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="loki"} > 3600
          )
        for: 30m
        labels:
          owner: areasong-ops
          severity: critical
          service: loki
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Loki 保留清理未成功完成"
          description: "Loki 正常运行，但保留清理未能在预期压缩周期和启动宽限时间内完成。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: LokiRetentionMarkerProcessingStalled
        expr: |
          sum(loki_boltdb_shipper_retention_sweeper_marker_files_current{job="loki"}) > 0
          and on ()
          sum(increase(loki_boltdb_shipper_retention_sweeper_marker_files_deleted_total{job="loki"}[6h])) == 0
        for: 3h
        labels:
          owner: areasong-ops
          severity: critical
          service: loki
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Loki 保留清理标记队列未减少"
          description: "删除标记超过配置的两小时删除延迟后仍在排队，且没有成功删除记录。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
