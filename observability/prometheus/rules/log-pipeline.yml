groups:
  - name: log_pipeline_alerts
    rules:
      - alert: LokiMetricsTargetDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Prometheus 无法获取 Loki"
          description: "Loki 恢复前，无法可靠使用日志查询和 Promtail 投递。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: PromtailMetricsTargetDown
        expr: up{job="promtail"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "Prometheus 无法获取 Promtail"
          description: "主机日志投递到 Loki 不可用，或无法抓取其指标端点。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: AuditLogPipelineCheckFailed
        expr: audit_log_pipeline_check_success == 0
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "auditd 事件未到达 Loki"
          description: "固定的无敏感信息审计探针无法在五分钟内完成写入、查询或观测。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"

      - alert: AuditLogPipelineStale
        expr: absent(audit_log_pipeline_last_event_timestamp_seconds) or time() - audit_log_pipeline_last_event_timestamp_seconds > 300 or time() - audit_log_pipeline_last_event_timestamp_seconds < 0
        for: 10m
        labels:
          owner: areasong-ops
          severity: critical
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/observability-alert-response.md"
          summary: "auditd 到 Loki 管道已过期"
          description: "Loki 中未发现近期固定审计管道探针。请检查 auditd、文件权限、Promtail positions 和 Loki 摄入。"
          grafana_url: "https://monitor.areasong.top/d/losangeles-observability-selfcheck/losangeles-observability-selfcheck?orgId=1&from=now-6h&to=now"
