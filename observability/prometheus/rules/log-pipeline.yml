groups:
  - name: log_pipeline_alerts
    rules:
      - alert: LokiMetricsTargetDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Loki is unavailable to Prometheus"
          description: "Log queries and Promtail delivery cannot be trusted until Loki recovers."

      - alert: PromtailMetricsTargetDown
        expr: up{job="promtail"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Promtail is unavailable to Prometheus"
          description: "Host log delivery to Loki is unavailable or its metrics endpoint cannot be scraped."

      - alert: AuditLogPipelineCheckFailed
        expr: audit_log_pipeline_check_success == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "auditd events are not reaching Loki"
          description: "The fixed non-sensitive audit probe could not be emitted, queried, or observed within five minutes."

      - alert: AuditLogPipelineStale
        expr: absent(audit_log_pipeline_last_event_timestamp_seconds) or time() - audit_log_pipeline_last_event_timestamp_seconds > 300 or time() - audit_log_pipeline_last_event_timestamp_seconds < 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The auditd-to-Loki pipeline is stale"
          description: "No recent fixed audit pipeline probe is visible in Loki. Check auditd, file permissions, Promtail positions, and Loki ingestion."
