groups:
  - name: areasong_ops_control_plane_alerts
    rules:
      - alert: AreaSongOpsMetricsTargetDown
        expr: up{job="areasong_ops"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 指标端点不可用"
          description: "Prometheus 无法抓取控制面 Web；请先检查 Web 容器、控制面网络和内部指标端点。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsRunnerUnreachable
        expr: areasong_ops_runner_reachable{job="areasong_ops"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops Web 无法连接 Runner"
          description: "Web 仍可被抓取，但无法通过受限 Unix Socket 访问 root Runner；禁止绕过 Socket 权限直接挂载 Docker Socket。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsActiveTaskOvertime
        expr: areasong_ops_oldest_active_task_age_seconds{job="areasong_ops"} > 7500
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 活动任务超过最长执行窗口"
          description: "最老的 queued/running 任务已超过 125 分钟；不要自动重试，请核对任务事件、业务身份和可能的人工恢复状态。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsSqliteSnapshotStale
        expr: |
          areasong_ops_last_sqlite_snapshot_timestamp_seconds{job="areasong_ops"} == 0
          or
          time() - areasong_ops_last_sqlite_snapshot_timestamp_seconds{job="areasong_ops"} > 90000
        for: 15m
        labels:
          owner: areasong-ops
          severity: warning
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops SQLite 一致性快照过期"
          description: "Runner 超过 25 小时没有生成新的 SQLite 快照；控制面状态备份将无法满足 24 小时 RPO。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-30h&to=now"

      - alert: AreaSongOpsCredentialRevocationOverdue
        expr: areasong_ops_credential_rotation_age_seconds{job="areasong_ops",state="switched_pending_revocation"} > 86400
        for: 5m
        labels:
          owner: areasong-ops
          severity: warning
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 凭据轮换等待撤销超时"
          description: "凭据 {{ $labels.credential_type }} 已切换超过 24 小时，但旧凭据仍未完成撤销验证和隔离回滚副本清理。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-30h&to=now"

      - alert: AreaSongOpsCredentialRotationNeedsAttention
        expr: areasong_ops_credential_rotation_active{job="areasong_ops",state="needs_attention"} == 1
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 凭据轮换需要人工处理"
          description: "凭据 {{ $labels.credential_type }} 的切换或自动回滚状态无法证明安全，禁止继续轮换并立即核对当前配置、真实同步和隔离回滚副本。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsRestoreDrillStale
        expr: absent(areasong_ops_restore_drill_last_success_timestamp_seconds) or time() - areasong_ops_restore_drill_last_success_timestamp_seconds > 35 * 86400
        for: 1h
        labels:
          owner: areasong-ops
          severity: warning
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 隔离恢复演练缺失或已超过 35 天"
          description: "完整备份集中的控制面 SQLite 超过 35 天未完成隔离恢复、完整性、关键表和行数验证。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-40d&to=now"

      - alert: AreaSongOpsTaskNeedsAttention
        expr: |
          areasong_ops_tasks_total{job="areasong_ops",state="needs_attention"} > 0
          or
          areasong_ops_task_state_total{job="areasong_ops",state="needs_attention"} > 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 有任务需要人工处理"
          description: "至少一个控制面任务进入 needs_attention；禁止自动重试或覆盖生产状态，先核对任务事件、生产变更事实、恢复点和回滚证据。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsTaskFailedRecoverable
        expr: |
          areasong_ops_tasks_total{job="areasong_ops",state="failed_recoverable"} > 0
          or
          areasong_ops_task_state_total{job="areasong_ops",state="failed_recoverable"} > 0
        for: 15m
        labels:
          owner: areasong-ops
          severity: warning
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 有可恢复失败任务未处理"
          description: "至少一个任务处于 failed_recoverable 超过 15 分钟；请重新生成计划并完成预检，禁止直接修改任务终态或绕过批准链。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsRunnerHeartbeatStale
        expr: |
          absent(areasong_ops_runner_heartbeat_timestamp_seconds{job="areasong_ops"})
          or
          time() - max by (job) (areasong_ops_runner_heartbeat_timestamp_seconds{job="areasong_ops"}) > 120
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops Runner 心跳过期或缺失"
          description: "控制面 Runner 超过两分钟没有发布新心跳；先核对 Runner 进程、SQLite 可写性和指标抓取链路，不要把旧任务标记为成功。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-15m&to=now"

      - alert: AreaSongOpsDesiredActualDriftCritical
        expr: |
          areasong_ops_desired_actual_drift{job="areasong_ops",severity="critical"} > 0
          or
          ops_state_drift{severity="critical"} > 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 期望状态与实际状态发生关键漂移"
          description: "控制面报告了 critical desired/actual drift；暂停相关自动动作，核对受管对象、期望摘要、运行身份和最近变更审计。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsDesiredActualDrift
        expr: |
          areasong_ops_desired_actual_drift{job="areasong_ops",severity!="critical"} > 0
          or
          ops_state_drift{severity!="critical"} > 0
        for: 10m
        labels:
          owner: areasong-ops
          severity: warning
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops 期望状态与实际状态发生漂移"
          description: "控制面报告了 desired/actual drift 持续超过十分钟；请先确认对象生命周期和受控配置是否已完成批准，不要直接覆盖实际状态。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsAccessPolicyProbeFailed
        expr: probe_success{job="blackbox_access_policy",service="areasong-ops"} == 0
        for: 5m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops Cloudflare Access 门禁探测失败"
          description: "未认证公网请求没有得到预期的 Cloudflare Access 302 登录跳转；请核对 DNS、Access Application、策略和源站限制。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"

      - alert: AreaSongOpsAccessProbeTargetDown
        expr: up{job="blackbox_access_policy",service="areasong-ops"} == 0
        for: 2m
        labels:
          owner: areasong-ops
          severity: critical
          service: areasong-ops
        annotations:
          runbook_url: "https://github.com/AreaSong/ops/blob/main/runbooks/playbooks/areasong-ops-control-plane.md"
          summary: "AreaSong Ops Access 探针抓取目标不可用"
          description: "Prometheus 无法从 Blackbox Exporter 获取 Access 策略探测结果；请先确认共享 Blackbox Exporter 是否正常。"
          grafana_url: "https://monitor.areasong.top/d/areasong-ops-control-plane/areasong-ops-control-plane?orgId=1&from=now-6h&to=now"
