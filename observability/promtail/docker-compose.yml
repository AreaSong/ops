x-json-log-options: &json-log-options
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-security-options: &security-options
  - no-new-privileges:true

services:
  promtail:
    image: grafana/promtail:3.1.0@sha256:b3db8e7b1cba0e8c45ce2ae72ebddfd88ebdcae86383f1680edf0074e9010ff6
    container_name: promtail
    restart: unless-stopped
    logging: *json-log-options
    security_opt: *security-options
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      - HOSTNAME=${HOSTNAME:-LosAngeles}
