server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    pipeline_stages:
      - match:
          selector: '{filename="/var/log/nginx/ops-business-access.log"}'
          stages:
            - regex:
                expression: 'host="(?P<service>resume\.areasong\.top|sorryiossearch\.areasong\.top|cpa\.areasong\.top|forge\.areasong\.top)"'
            - replace:
                source: service
                expression: 'resume\.areasong\.top'
                replace: 'resume-jadeai'
            - replace:
                source: service
                expression: 'sorryiossearch\.areasong\.top'
                replace: 'account-vault'
            - replace:
                source: service
                expression: 'cpa\.areasong\.top'
                replace: 'sub2api'
            - replace:
                source: service
                expression: 'forge\.areasong\.top'
                replace: 'areaforge'
            - labels:
                service:
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          host: LosAngeles
          instance: LosAngeles
          service: nginx
          __path__: /var/log/nginx/*.log

  - job_name: backup
    static_configs:
      - targets:
          - localhost
        labels:
          job: backup
          host: LosAngeles
          instance: LosAngeles
          service: backup
          __path__: /var/log/backup/*.log

  - job_name: observability
    static_configs:
      - targets:
          - localhost
        labels:
          job: observability
          host: LosAngeles
          instance: LosAngeles
          service: observability
          __path__: /var/log/observability/*.log

  - job_name: business_errors
    pipeline_stages:
      - json:
          expressions:
            event_timestamp: timestamp
            service: service
            level: level
            message: message
      - timestamp:
          source: event_timestamp
          format: RFC3339Nano
      - labels:
          service:
          level:
      - output:
          source: message
    static_configs:
      - targets:
          - localhost
        labels:
          job: business_errors
          host: LosAngeles
          instance: LosAngeles
          __path__: /var/log/business-errors/*.log

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: LosAngeles
          instance: LosAngeles
          service: host
          __path__: /var/log/syslog

  - job_name: fail2ban
    static_configs:
      - targets:
          - localhost
        labels:
          job: fail2ban
          host: LosAngeles
          instance: LosAngeles
          service: fail2ban
          __path__: /var/log/fail2ban.log

  - job_name: fail2ban_enriched
    static_configs:
      - targets:
          - localhost
        labels:
          job: fail2ban_enriched
          host: LosAngeles
          instance: LosAngeles
          service: fail2ban
          __path__: /var/log/security/fail2ban-enriched.log

  - job_name: auditd
    pipeline_stages:
      - drop:
          expression: 'type=(EXECVE|PROCTITLE)'
    static_configs:
      - targets:
          - localhost
        labels:
          job: auditd
          host: LosAngeles
          instance: LosAngeles
          service: auditd
          __path__: /var/log/audit/audit.log

  - job_name: xray_access
    pipeline_stages:
      - regex:
          expression: '\[(?P<inbound>[^\s\]]+) (?:->|>>) (?P<outbound>[^\s\]]+)\] email: (?P<email>\S+)'
      - labels:
          outbound:
    static_configs:
      - targets:
          - localhost
        labels:
          job: xray_access
          host: LosAngeles
          instance: LosAngeles
          service: x-ui
          __path__: /var/log/xray/*.log
