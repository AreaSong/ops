server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          host: LosAngeles
          __path__: /var/log/nginx/*.log

  - job_name: backup
    static_configs:
      - targets:
          - localhost
        labels:
          job: backup
          host: LosAngeles
          __path__: /var/log/backup/*.log

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: LosAngeles
          __path__: /var/log/syslog
