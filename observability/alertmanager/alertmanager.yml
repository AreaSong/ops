global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.qq.com:587
  smtp_from: 2695266624@qq.com
  smtp_auth_username: 2695266624@qq.com
  smtp_auth_identity: 2695266624@qq.com
  smtp_auth_password_file: /etc/alertmanager/smtp_password.mount
  smtp_require_tls: true

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: email-ops
  group_by:
    - alertname
    - severity
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: email-daily-audit
      matchers:
        - alertname="DailyOpsAuditReport"
      group_by:
        - alertname
        - report_date
      group_wait: 5s
      group_interval: 24h
      repeat_interval: 168h

    - receiver: email-ops
      matchers:
        - scope="business"
      group_by:
        - alertname
        - severity
        - service
        - check
        - journey
        - slo
        - window
        - target
      group_wait: 15s
      group_interval: 5m
      repeat_interval: 2h

    - receiver: email-ops
      matchers:
        - alertname=~"App.*|HttpProbeFailed|SslCert.*"
      group_by:
        - alertname
        - severity
        - service
        - check
        - target
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h

    - receiver: email-ops
      matchers:
        - alertname=~"Backup.*|R2Backup.*"
      group_by:
        - alertname
        - severity
        - job
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 2h

    - receiver: email-ops
      matchers:
        - alertname=~"Postgres.*|Redis.*"
      group_by:
        - alertname
        - severity
        - service
        - instance
        - datname
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 3h

    - receiver: email-ops
      matchers:
        - alertname="Fail2banSshdBanBurst"
      group_by:
        - alertname
        - severity
        - instance
        - jail
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 12h

    - receiver: email-ops
      matchers:
        - alertname="CloudflareOriginCertExpiring180Days"
      group_by:
        - alertname
        - severity
        - cert
      group_wait: 1m
      group_interval: 24h
      repeat_interval: 720h

    - receiver: email-ops
      matchers:
        - alertname="CloudflareOriginCertExpiring90Days"
      group_by:
        - alertname
        - severity
        - cert
      group_wait: 1m
      group_interval: 12h
      repeat_interval: 336h

    - receiver: email-ops
      matchers:
        - alertname="CloudflareOriginCertExpiring30Days"
      group_by:
        - alertname
        - severity
        - cert
      group_wait: 1m
      group_interval: 6h
      repeat_interval: 72h

    - receiver: email-ops
      matchers:
        - alertname=~"CloudflareOriginCertExpiringCritical|CloudflareOriginCertCheckFailed|CloudflareOriginCertMetricsStale"
      group_by:
        - alertname
        - severity
        - cert
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h

    - receiver: email-ops
      matchers:
        - alertname=~"SecurityMetricsStale|Auditd.*|Ufw.*|Fail2ban.*|Ssh.*|Nginx.*"
      group_by:
        - alertname
        - severity
        - instance
        - jail
        - status_class
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h

    - receiver: email-ops
      matchers:
        - severity="critical"
      group_by:
        - alertname
        - severity
        - service
        - instance
        - target
      group_wait: 15s
      group_interval: 5m
      repeat_interval: 2h

    - receiver: email-ops
      matchers:
        - severity="warning"
      group_by:
        - alertname
        - severity
        - service
        - instance
        - target
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h

inhibit_rules:
  - source_matchers:
      - alertname="BlackboxExporterMetricsTargetDown"
    target_matchers:
      - alertname=~"AppBlackboxTargetDown|BusinessBlackboxTargetDown|AppHttpProbeFailed|BusinessHttpProbeFailed"

  - source_matchers:
      - alertname=~"DockerMetricsStale|DockerMetricsCollectionFailed"
    target_matchers:
      - alertname=~"DockerContainer.*"

  - source_matchers:
      - alertname="SecurityMetricsStale"
    target_matchers:
      - alertname=~"Auditd.*|Ufw.*|Fail2ban.*|Ssh.*|Nginx.*"

  - source_matchers:
      - alertname="BusinessLogMetricsStale"
    target_matchers:
      - alertname=~"BusinessHttp.*|BusinessSlowRequestsHigh|BusinessLogParseErrorsHigh"

  - source_matchers:
      - alertname=~"LokiMetricsTargetDown|PromtailMetricsTargetDown"
    target_matchers:
      - alertname=~"AuditLogPipeline.*"

receivers:
  - name: email-daily-audit
    email_configs:
      - to: 3177348309@qq.com
        send_resolved: false
        headers:
          Subject: '{{ template "email.daily.audit.subject" . }}'
        html: '{{ template "email.daily.audit.html" . }}'

  - name: email-ops
    email_configs:
      - to: 3177348309@qq.com
        send_resolved: true
        headers:
          Subject: '{{ template "email.ops.subject" . }}'
        html: '{{ template "email.ops.html" . }}'
