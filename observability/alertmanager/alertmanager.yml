global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: warning

receivers:
  - name: default
    webhook_configs:
      - url: "http://127.0.0.1:9999/webhook"
        send_resolved: true
    # 替换为实际通知渠道，示例：
    # webhook_configs:
    #   - url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"

  - name: critical
    webhook_configs:
      - url: "http://127.0.0.1:9999/webhook"
        send_resolved: true

  - name: warning
    webhook_configs:
      - url: "http://127.0.0.1:9999/webhook"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
