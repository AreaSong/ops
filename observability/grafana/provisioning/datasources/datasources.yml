apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s
    correlations:
      - targetUID: loki
        label: 查看同服务日志
        description: 按 Prometheus service 标签跳转到 Loki 日志
        config:
          type: query
          field: Value
          target:
            expr: '{service="$${__field.labels.service}"}'
            queryType: range
            refId: A
      - targetUID: loki
        label: 查看同容器业务日志
        description: 按 Docker 指标 name 标签跳转到对应的已脱敏业务日志
        config:
          type: query
          field: Value
          target:
            expr: '{job="business_errors",container="$${__field.labels.name}"}'
            queryType: range
            refId: A

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
