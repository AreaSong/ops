name: observability

x-json-log-options: &json-log-options
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-security-options: &security-options
  - no-new-privileges:true

x-cap-drop-all: &cap-drop-all
  - ALL

services:
  prometheus:
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    cpus: "0.75"
    pids_limit: 256
    logging: *json-log-options
    security_opt: *security-options
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /opt/ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - /var/lib/observability/prometheus:/prometheus
    networks:
      - monitoring
    depends_on:
      - alertmanager
      - node-exporter
      - blackbox-exporter

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: alertmanager
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    cpus: "0.25"
    pids_limit: 128
    logging: *json-log-options
    security_opt: *security-options
    cap_drop: *cap-drop-all
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - /opt/ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /opt/ops/observability/alertmanager/templates:/etc/alertmanager/templates:ro
      - /etc/observability/alertmanager-smtp-password:/etc/alertmanager/smtp_password:ro
      - /var/lib/observability/alertmanager:/alertmanager
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: grafana
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    cpus: "0.50"
    pids_limit: 256
    logging: *json-log-options
    security_opt: *security-options
    env_file:
      - /etc/observability/grafana.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /var/lib/observability/grafana:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.0@sha256:d947e68a84d9e44915dfa08c3bec27e2124efd5ba6c83443eb53578101ec69e3
    container_name: loki
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    cpus: "0.75"
    pids_limit: 256
    logging: *json-log-options
    security_opt: *security-options
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - /opt/ops/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - /var/lib/observability/loki:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.1.0@sha256:b3db8e7b1cba0e8c45ce2ae72ebddfd88ebdcae86383f1680edf0074e9010ff6
    container_name: promtail
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 256m
    cpus: "0.25"
    pids_limit: 128
    logging: *json-log-options
    security_opt: *security-options
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /opt/ops/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    container_name: node-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    cpus: "0.25"
    pids_limit: 128
    logging: *json-log-options
    security_opt: *security-options
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    container_name: blackbox-exporter
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    cpus: "0.25"
    pids_limit: 128
    logging: *json-log-options
    security_opt: *security-options
    cap_drop: *cap-drop-all
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - /opt/ops/observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring


  postgres-exporter-sub2api:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    container_name: postgres-exporter-sub2api
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    cpus: "0.25"
    pids_limit: 128
    logging: *json-log-options
    security_opt: *security-options
    cap_drop: *cap-drop-all
    env_file:
      - /etc/observability/postgres-exporter-sub2api.env
    networks:
      - monitoring
      - sub2api

  postgres-exporter-account-vault:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    container_name: postgres-exporter-account-vault
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    cpus: "0.25"
    pids_limit: 128
    logging: *json-log-options
    security_opt: *security-options
    cap_drop: *cap-drop-all
    env_file:
      - /etc/observability/postgres-exporter-account-vault.env
    networks:
      - monitoring
      - account-vault

  redis-exporter-sub2api:
    image: oliver006/redis_exporter:v1.62.0@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
    container_name: redis-exporter-sub2api
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m
    cpus: "0.25"
    pids_limit: 128
    logging: *json-log-options
    security_opt: *security-options
    cap_drop: *cap-drop-all
    env_file:
      - /etc/observability/redis-exporter-sub2api.env
    networks:
      - monitoring
      - sub2api

networks:
  monitoring:
    driver: bridge
  sub2api:
    external: true
    name: sub2api_sub2api-network
  account-vault:
    external: true
    name: account-vault_default
