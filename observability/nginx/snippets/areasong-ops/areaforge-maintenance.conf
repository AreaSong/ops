add_header Retry-After "300" always;
return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Service maintenance</title></head><body><h1>Service maintenance</h1><p>Please try again later.</p></body></html>';
