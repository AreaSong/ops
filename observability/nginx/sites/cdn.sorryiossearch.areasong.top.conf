# sorryiossearch.areasong.top - Cloudflare proxied origin.
server {
    listen 80;
    listen [::]:80;
    server_name sorryiossearch.areasong.top;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    include /etc/nginx/snippets/cloudflare-origin-only.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sorryiossearch.areasong.top;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    include /etc/nginx/snippets/cloudflare-origin-only.conf;

    ssl_certificate     /etc/ssl/cf/top/origin.pem;
    ssl_certificate_key /etc/ssl/cf/top/origin.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/security-headers-hsts.conf;
    include /etc/nginx/snippets/security-headers-basic.conf;

    location / {
        proxy_pass http://127.0.0.1:8392;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
