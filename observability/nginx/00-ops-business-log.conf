# Managed by /opt/ops. Adds a second, metrics-friendly access log without
# changing the existing default Nginx access log.
log_format ops_business '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'host="$host" request_time=$request_time '
                        'upstream_response_time="$upstream_response_time"';

access_log /var/log/nginx/ops-business-access.log ops_business;
